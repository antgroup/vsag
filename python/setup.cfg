[metadata]
name = pyvsag
description = vsag is a vector indexing library used for similarity search
author = the vsag project
author_email = the.vsag.project@gmail.com
url = https://github.com/antgroup/vsag
keywords = search, nearest, neighbors
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
packages =
    pyvsag
    pyvsag.eval
python_requires = >=3.10
install_requires =
    cffi>=1.15
    numpy

[options.extras_require]
eval =
    h5py
    pyyaml

[options.entry_points]
console_scripts =
    pyvsag-eval = pyvsag.eval.__main__:main

[options.package_data]
pyvsag =
    _vsag_c_api.h
    _vsag_eval_c_api.h
    libvsag_c*.so*
    libvsag_c*.dylib


