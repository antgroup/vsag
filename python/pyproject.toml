[build-system]
requires = [
    "setuptools>=70.1",
    "setuptools_scm",
    "wheel",
]
build-backend = "setuptools.build_meta"

# One py3-none wheel per architecture: libvsag_c is loaded through cffi, so a single build
# serves every supported CPython (3.10+).
[tool.cibuildwheel]
build = "cp310-*"
skip = ["*-musllinux*", "*i686*", "pp*"]
before-build = "bash scripts/deps/install_deps_centos.sh"
before-all = "yum install -y gcc gcc-c++ ca-certificates"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# libgomp comes from gcc-toolset; auditwheel must find it to bundle it into the wheel.
repair-wheel-command = "LD_LIBRARY_PATH=$(dirname $(gcc -print-file-name=libgomp.so.1)):$LD_LIBRARY_PATH auditwheel repair -w {dest_dir} {wheel}"
