# CPU vs. GPU PiPNN build on SIFT1M (1M base / 10K query / 128 dimensions).
# Needs a VSAG built with ENABLE_CUDA=ON and one CUDA device; without them the "gpu" case silently
# builds on the CPU and reports a CPU time. Both graphs are query-validated at ef_search=128.
# Keep OPENBLAS_NUM_THREADS=1 so BLAS parallelism does not contaminate build_thread_count.
global:
    num_threads_searching: 1
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_pipnn_gpu.json"

build_pipnn_cpu:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "build"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"pipnn","max_degree":32,"alpha":1.2,"build_thread_count":32}}'
    index_path: "/tmp/vsag_pipnn_gpu/pipnn_cpu.index"
    num_threads_building: 32
    disable_memory: true

build_pipnn_gpu:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "build"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"pipnn","max_degree":32,"alpha":1.2,"build_thread_count":32,"pipnn_enable_gpu_build":true,"pipnn_gpu_device_id":0}}'
    index_path: "/tmp/vsag_pipnn_gpu/pipnn_gpu.index"
    num_threads_building: 32
    disable_memory: true

search_pipnn_cpu_ef128:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"pipnn","max_degree":32,"alpha":1.2,"build_thread_count":32}}'
    search_params: '{"hgraph":{"ef_search":128}}'
    index_path: "/tmp/vsag_pipnn_gpu/pipnn_cpu.index"
    search_query_count: 10000
    topk: 10
    disable_memory: true

search_pipnn_gpu_ef128:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"pipnn","max_degree":32,"alpha":1.2,"build_thread_count":32,"pipnn_enable_gpu_build":true,"pipnn_gpu_device_id":0}}'
    search_params: '{"hgraph":{"ef_search":128}}'
    index_path: "/tmp/vsag_pipnn_gpu/pipnn_gpu.index"
    search_query_count: 10000
    topk: 10
    disable_memory: true
