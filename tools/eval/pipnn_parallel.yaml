# Fixed-quality build-thread scaling on SIFT1M (1M base / 10K query / 128 dimensions).
# Builder parameters and ef_search are tuned independently for Recall@10 >= 0.993.
# Runs 8, 16, 32, 48, and 96 build threads; every built graph has a matching search case.
# Keep OPENBLAS_NUM_THREADS=1 so BLAS parallelism does not contaminate build_thread_count.
global:
    num_threads_searching: 1
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_pipnn_parallel.json"

build_nsw_t32:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "build"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"nsw","max_degree":32,"ef_construction":300,"build_thread_count":32}}'
    index_path: "/tmp/vsag_pipnn_parallel/nsw_t32.index"
    num_threads_building: 32
    disable_memory: true

build_odescent_t32:
    datapath: "/tmp/sift-128-euclidean.hdf5"
    type: "build"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","graph_type":"odescent","max_degree":32,"alpha":1.2,"ef_construction":300,"build_thread_count":32}}'
    index_path: "/tmp/vsag_pipnn_parallel/odescent_t32.index"
    num_threads_building: 32
    disable_memory: true

