name: check-format
description: Check repository formatting with preinstalled clang-format 20
runs:
  using: composite
  steps:
    - name: Check formatter prerequisites
      shell: bash
      run: |
        ./scripts/ci/configure-git-safe-directory.sh
        version=$(clang-format-20 --version)
        echo "$version"
        if [[ ! "$version" =~ version\ 20\. ]]; then
          echo '::error::Format Check requires preinstalled clang-format major version 20.'
          exit 1
        fi
    - name: Run Clang format check
      shell: bash
      run: ./scripts/format/check_format.sh
