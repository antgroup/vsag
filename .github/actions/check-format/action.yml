name: check-format
description: Shared steps for automatic and manual checks
runs:
  using: composite
  steps:
    - name: Install Clang format
      shell: bash
      run: |
        sudo apt-get update
        sudo bash scripts/deps/install_toolchain_ubuntu.sh
        sudo apt-get install -y clang-format-20
        sudo ln -sf /usr/bin/clang-format-20 /usr/bin/clang-format
        clang-format --version
    - name: Run Clang format check
      shell: bash
      run: ./scripts/format/check_format.sh
