name: asan-build-and-test-test-asan-aarch64
description: Shared test_asan_aarch64 execution; callers own runners and dependencies.
inputs:
  matrix-test-type:
    description: Caller matrix.test_type
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Clean Build
      shell: sh
      run: rm -rf ./build
    - name: Download Test
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: test_aarch64-${{ github.run_id }}
        path: ./build
    - name: Validate Test Artifact
      shell: sh
      run: |
        if ! test -s ./build/tests/unittests || ! test -s ./build/tests/functests; then
          echo "::error::Aarch64 test artifact is incomplete; expected tests/unittests and tests/functests"
          df -h .
          find ./build -maxdepth 3 -type f -printf '%P %s bytes\n' 2>/dev/null || true
          exit 1
        fi
    - name: Do Asan Test In ${{ inputs.matrix-test-type }}
      shell: sh
      run: |
        echo leak:libomp.so > omp.supp
        echo leak:libgomp.so >> omp.supp
        export LSAN_OPTIONS=suppressions=omp.supp
        chmod +x ./build/tests/${{ inputs.matrix-test-type }}
        if [ "$SMOKE" = "true" ]; then
          python3 scripts/ci/platform_smoke.py "${{ inputs.matrix-test-type }}"
        else
          ./scripts/testing/test_parallel_by_name.sh ${{ inputs.matrix-test-type }}
        fi
    - name: Upload Log
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: ./log
        name: log-aarch64-${{ inputs.matrix-test-type }}-${{ github.run_id }}
        compression-level: 1
        retention-days: 3
        overwrite: 'true'
