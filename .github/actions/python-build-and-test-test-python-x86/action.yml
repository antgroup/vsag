name: Test Python wheel x86
description: Shared installed-wheel tests.
inputs:
  numpy-version:
    description: NumPy version or wildcard pattern, e.g. 1.26.4 or 2.* (not a comparison specifier)
    default: '2.*'
  mode:
    description: ordinary or openmp
    default: ordinary
runs:
  using: composite
  steps:
    - uses: ./.github/actions/python-wheel-test
      with:
        arch: x86_64
        artifact: wheelhouse_x86-${{ github.run_id }}
        numpy-version: ${{ inputs.numpy-version }}
        mode: ${{ inputs.mode }}
