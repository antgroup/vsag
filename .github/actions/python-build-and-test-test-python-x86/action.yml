name: python-build-and-test-test-python-x86
description: Shared test_python_x86 execution; callers own runners and dependencies.
runs:
  using: composite
  steps:
    - name: Prepare Env
      shell: bash -e {0}
      run: sudo bash ./scripts/deps/install_deps_ubuntu.sh
    - name: Download Test
      uses: actions/download-artifact@v5
      with:
        name: wheelhouse_x86-${{ github.run_id }}
        path: ./wheelhouse
    - name: Install Python Wheel
      shell: bash -e {0}
      run: |
        pip3 uninstall pyvsag -y
        wheel=(./wheelhouse/*.whl)
        pip3 install "${wheel[0]}[langchain]"
        pip3 install numpy pyjson pytest
        pip3 install "langchain-tests==1.1.9"
    - name: Run Python Test
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/testing/daily_measure.py --name pytest --owner bindings-examples-compatibility --cwd tests/python -- python3 -m pytest . -v --tb=short 2>&1 | tee tests/python/test-output.log
    - name: Test LangChain 0.3 compatibility
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install 'langchain-core>=0.3.77,<0.4'
        python3 -m pytest tests/python/test_langchain_vector_store.py -v --tb=short
    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: pytest-logs-x86-${{ github.run_id }}
        path: ./tests/python/test-output.log
        retention-days: 30
        if-no-files-found: ignore
