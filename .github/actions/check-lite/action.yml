name: check-lite
description: Shared steps for automatic and manual checks
inputs:
  mode:
    description: Lite build mode
    required: true
runs:
  using: composite
  steps:
    - name: Check preinstalled tools
      shell: bash
      run: |
        ./scripts/ci/configure-git-safe-directory.sh
        for tool in clang-format-20 clang-tidy-20; do
          version=$("$tool" --version)
          echo "$version"
          if [[ ! "$version" =~ version\ 20\. ]]; then
            echo "::error::Lite requires preinstalled $tool major version 20."
            exit 1
          fi
        done
        for tool in cmake ninja c++ gcov python3; do
          command -v "$tool"
          "$tool" --version
        done
    - name: Check all Lite formatting
      shell: bash
      run: |
        clang-format-20 --dry-run --Werror include/vsag/lite/*.h src/lite/*.h src/lite/*.cpp lite/example/*.cpp src/simd/kernels/rabitq_compute.h
    - name: Configure
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        flags=(-DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON)
        # default-off deliberately omits the option to verify its default.
        if [[ "$MODE" != default-off ]]; then
          flags+=(-DENABLE_RABITQ_LITE_BACKEND=ON)
        fi
        if [[ "$MODE" == rabitq-on ]]; then
          flags+=(-DENABLE_BENCHMARKS=ON)
        fi
        if [[ "$MODE" == sanitizer ]]; then
          flags+=(-DCMAKE_BUILD_TYPE=Debug
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
            '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined'
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined')
        elif [[ "$MODE" == coverage ]]; then
          flags+=(-DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON)
        fi
        cmake -S lite -B build-lite -G Ninja "${flags[@]}"
    - name: Check every configured Lite translation unit
      if: inputs.mode == 'rabitq-on'
      shell: bash
      run: python3 lite/tools/check_tidy.py --build build-lite
    - name: Build and test
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: halt_on_error=1
      shell: bash
      run: |
        cmake --build build-lite -j2
        ctest --test-dir build-lite --output-on-failure
    - name: Install benchmark preparation dependencies
      if: inputs.mode == 'rabitq-on'
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/lite-benchmark-venv"
        "$RUNNER_TEMP/lite-benchmark-venv/bin/python" -m pip install numpy==1.26.4 h5py==3.11.0 pyarrow==17.0.0
        echo "$RUNNER_TEMP/lite-benchmark-venv/bin" >> "$GITHUB_PATH"
    - name: Benchmark regression tests
      if: inputs.mode == 'rabitq-on'
      shell: bash
      env:
        VSAG_MIXED_PROBE: ${{ github.workspace }}/build-lite/lite_acceptance_mixed_cpu_acceptance
      run: |
        python3 -c 'import numpy, h5py, pyarrow'
        test -x "$VSAG_MIXED_PROBE"
        python3 -m unittest discover -s lite/benchmark -p 'test_*.py'
    - name: Lite CI contracts, collector fixtures and 90 percent gate
      if: inputs.mode == 'coverage'
      shell: bash
      run: |
        python3 -m unittest discover -s lite/tools -p 'test_*.py'
        python3 lite/tools/collect_coverage.py --root "$PWD" --build build-lite --output lite-coverage.json --fail-under 90
    - name: Install and check shared/static consumers
      if: inputs.mode == 'default-off' || inputs.mode == 'rabitq-on'
      shell: bash
      run: |
        cmake --install build-lite --prefix "$PWD/install-lite"
        test -f install-lite/lib/libvsag-lite.a
        if ldd build-lite/libvsag-lite.so | grep -q 'libvsag\.so'; then
          echo 'Standalone Lite unexpectedly depends on Full VSAG' >&2
          exit 1
        fi
        cmake -S lite/example -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install-lite"
        cmake --build build-consumer -j2
        ./build-consumer/lite_example "$RUNNER_TEMP/lite-shared.snapshot"
        c++ -std=c++17 -Iinstall-lite/include lite/example/main.cpp install-lite/lib/libvsag-lite.a -o lite-static-consumer
        ./lite-static-consumer "$RUNNER_TEMP/lite-static.snapshot"
    - name: Installed RaBitQ lifecycle
      if: inputs.mode == 'rabitq-on'
      shell: bash
      run: |
        c++ -std=c++17 -Iinstall-lite/include lite/example/rabitq_example.cpp -Linstall-lite/lib -Wl,-rpath,"$PWD/install-lite/lib" -lvsag-lite -o lite-rabitq-consumer
        ./lite-rabitq-consumer
    - name: Retain diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lite-${{ inputs.mode }}-diagnostics
        if-no-files-found: ignore
        path: |
          build-lite/Testing/Temporary/*.log
          build-lite/CMakeFiles/CMakeOutput.log
          lite-coverage.json
