name: asan-build-and-test-build-asan-aarch64
description: Shared build_asan_aarch64 execution; callers own runners and dependencies.
runs:
  using: composite
  steps:
    - name: Load Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "2G"
        save: ${{ github.event_name != 'pull_request' }}
        key: build-aarch-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
    - name: Make Asan
      shell: sh
      run: |
        export CMAKE_GENERATOR="Ninja"
        python3 scripts/ci/monitor_build.py --output-dir "$RUNNER_TEMP/arm-build-diagnostics" -- \
          make asan COMPILE_JOBS=3 DATACELL_COMPILE_JOBS=1 VSAG_ENABLE_EXAMPLES=ON
    - name: Upload ARM build diagnostics
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v5
      with:
        path: ${{ runner.temp }}/arm-build-diagnostics/
        name: arm-build-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: warn
        retention-days: 7
    - name: Clean
      shell: sh
      run: find ./build -type f -name "*.o" -exec rm -f {} +
    - name: Save Test
      uses: actions/upload-artifact@v5
      with:
        path: ./build/
        name: test_aarch64-${{ github.run_id }}
        compression-level: 1
        retention-days: 3
        overwrite: 'true'
