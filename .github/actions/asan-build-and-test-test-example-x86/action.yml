name: asan-build-and-test-test-example-x86
description: Shared test_example_x86 execution; callers own runners and dependencies.
runs:
  using: composite
  steps:
    - name: Clean Env
      shell: sh
      run: rm -rf ./build
    - name: Download Test
      uses: actions/download-artifact@v5
      with:
        name: test_x86-${{ github.run_id }}
        path: ./build
    - name: Do Test In example
      shell: sh
      run: |
        cd ./build/examples/cpp
        for example in ./*; do
          filename=$(basename "$example")
          if [[ $filename =~ ^[0-9]{3} ]]; then
            chmod +x $example
            echo "Run $example"
            $example
          fi
        done
