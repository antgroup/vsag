name: tsan-build-and-test-build-tsan
description: Shared build_tsan execution; callers own runners and dependencies.
runs:
  using: composite
  steps:
    - name: Load Cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "5G"
        save: ${{ github.event_name != 'pull_request' }}
        key: build-tsan-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
    - name: Make Tsan
      shell: sh
      run: export CMAKE_GENERATOR="Ninja"; make tsan COMPILE_JOBS=3
    - name: Clean
      shell: sh
      run: find ./build -type f -name "*.o" -exec rm -f {} +
    - name: Save Test
      uses: actions/upload-artifact@v5
      with:
        path: ./build
        name: test_x86-${{ github.run_id }}-tsan
        compression-level: 1
        retention-days: 3
        overwrite: 'true'
