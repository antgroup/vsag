name: asan-build-and-test-test-asan-macos-arm64
description: Shared test_asan_macos_arm64 execution; callers own runners and dependencies.
inputs:
  matrix-test-type:
    description: Caller matrix.test_type
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install Dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      shell: bash -e {0}
      run: bash ./scripts/deps/install_deps.sh
    - name: Clean Env
      shell: bash -e {0}
      run: rm -rf ./build
    - name: Download Test
      id: download-tests
      uses: actions/download-artifact@v5
      with:
        name: test_macos_arm64-${{ github.run_id }}
        path: ./build
    - name: Do Asan Test In ${{ inputs.matrix-test-type }}
      env:
        ASAN_OPTIONS: detect_container_overflow=0
      shell: bash -e {0}
      run: |
        chmod +x ./build/tests/${{ inputs.matrix-test-type }}
        if [ "$SMOKE" = "true" ]; then
          python3 scripts/ci/platform_smoke.py "${{ inputs.matrix-test-type }}"
          if [ "${{ inputs.matrix-test-type }}" = "unittests" ]; then
            python3 scripts/ci/platform_smoke.py examples
          fi
        else
          ./scripts/testing/test_parallel_by_name.sh ${{ inputs.matrix-test-type }}
        fi
    - name: Run full examples independently
      if: ${{ !cancelled() && steps.download-tests.outcome == 'success' && env.FULL_EXAMPLES == 'true' && env.SMOKE != 'true' && inputs.matrix-test-type == 'unittests' }}
      env:
        ASAN_OPTIONS: detect_container_overflow=0
      shell: bash -e {0}
      run: python3 scripts/testing/daily_measure.py --name examples --owner bindings-examples-compatibility -- python3 scripts/ci/platform_smoke.py all-examples
    - name: Upload Log
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: ./log
        name: log-macos-${{ inputs.matrix-test-type }}-${{ github.run_id }}
        compression-level: 1
        retention-days: 3
        overwrite: 'true'
