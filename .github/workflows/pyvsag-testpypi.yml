name: pyvsag TestPyPI

# Builds pyvsag wheels from main; non-main dispatches are allowed only with publish=false,
# and optionally uploads them to TestPyPI. Nothing here touches the real PyPI or a GitHub Release.
# Uploading is on by default. Manual runs can untick publish to only build, and the repository
# variable PYVSAG_NIGHTLY_PUBLISH=false pauses the nightly upload without touching the workflow.
# A nightly run is skipped when the last successful nightly already built the same main commit.
on:
  schedule:
    # 03:00 Beijing time (19:00 UTC the previous day), offset to avoid the top-of-hour rush.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels to TestPyPI (otherwise only build and keep the artifact)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pyvsag-testpypi
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Pin source commit
    if: ${{ github.event_name != 'schedule' || github.repository == 'antgroup/vsag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      skip: ${{ steps.unchanged.outputs.skip }}
      macos-matrix: ${{ steps.macos-matrix.outputs.matrix }}
    steps:
      - name: Require main for publication
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$PUBLISH" != "false" ]; then
            echo "Publication requires main; select publish=false to validate another branch."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve immutable commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select macOS test matrix
        id: macos-matrix
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "matrix=$(python3 scripts/ci/macos_wheel_ci.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Skip when main has no new commits
        id: unchanged
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pyvsag-testpypi.yml/runs?branch=main&event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null) || {
            echo "::warning::Failed to query the last successful nightly run; building instead of skipping."
            last=""
          }
          if [ "$last" = "$SHA" ]; then
            echo "main is still at $SHA, which the last successful nightly already built; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build py3-none wheel on ${{ matrix.arch }}
    needs: resolve-source
    if: ${{ needs.resolve-source.outputs.skip != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-wheel-build
        with:
          arch: ${{ matrix.arch }}
          artifact: pyvsag-wheels-${{ matrix.arch }}
          source-sha: ${{ needs.resolve-source.outputs.sha }}

  build-macos:
    name: Build macOS arm64 wheel
    needs: resolve-source
    if: ${{ needs.resolve-source.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-wheel-build-macos
        with:
          artifact: pyvsag-wheels-macos-arm64
          source-sha: ${{ needs.resolve-source.outputs.sha }}

  test-macos:
    name: macOS ${{ matrix.key }}
    needs: [resolve-source, build-macos]
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-source.outputs.macos-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: pyvsag-wheels-macos-arm64
          path: wheelhouse
      - uses: actions/download-artifact@v5
        with:
          name: provenance-pyvsag-wheels-macos-arm64
      - name: Test verified wheel in a clean environment
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
          NUMPY_VERSION: ${{ matrix.numpy }}
          TEST_MODE: ${{ matrix.mode }}
        run: python3 scripts/ci/macos_wheel_ci.py test --source "$SOURCE_SHA" --numpy "$NUMPY_VERSION" --mode "$TEST_MODE"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-python-report-${{ matrix.key }}
          path: python-test-report
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  publish-linux:
    name: Upload Linux wheels to TestPyPI
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.PYVSAG_NIGHTLY_PUBLISH != 'false')) && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyvsag/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pyvsag-wheels-x86_64
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: pyvsag-wheels-aarch64
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  publish-macos:
    name: Upload macOS wheel to TestPyPI
    needs: [resolve-source, build-macos, test-macos]
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.PYVSAG_NIGHTLY_PUBLISH != 'false')) && needs.build-macos.result == 'success' && needs.test-macos.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyvsag/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: pyvsag-wheels-macos-arm64
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: provenance-pyvsag-wheels-macos-arm64
      - name: Reject an already published macOS filename
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: python3 scripts/ci/macos_wheel_ci.py check-unpublished --source "$SOURCE_SHA"
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  verify-testpypi-macos:
    name: Verify macOS wheel from TestPyPI
    needs: [resolve-source, publish-macos]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: provenance-pyvsag-wheels-macos-arm64
      - name: Download exact published wheel and verify its hash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: python3 scripts/ci/macos_wheel_ci.py download --source "$SOURCE_SHA"
      - name: Audit and test the published wheel
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          python3 scripts/python/check_macos_wheel.py wheelhouse/*.whl
          python3 scripts/ci/macos_wheel_ci.py test --source "$SOURCE_SHA"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-testpypi-install-report
          path: python-test-report
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
