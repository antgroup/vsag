name: Manual Checks

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        default: full-pr
        options: [full-pr, full-branch, format, docs, lite, asan, tsan, python, lint, coverage, compatibility, simd, toolchain, performance, build-performance]
      ref:
        description: Toolchain ref or approved main benchmark SHA
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read

jobs:
  pr:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    name: Manual PR
    if: inputs.check == 'full-pr'
    uses: ./.github/workflows/pr-ci.yml
  branch:
    name: Manual Branch
    if: ${{ contains(fromJSON('["full-branch","asan","tsan","python","lint","coverage","compatibility","simd"]'), inputs.check) }}
    uses: ./.github/workflows/main-ci.yml

    with:
      profile: ${{ inputs.check }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  validate:
    if: inputs.check == 'docs'
    name: Manual Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/check-docs

  clang-format-check:
    if: inputs.check == 'format'
    name: Manual Format
    runs-on: ubuntu-24.04
    # Docker Hub alternative: vsaglib/vsag:ci-main-base
    container: ghcr.io/antgroup/vsag:ci-main-base
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-format

  build-test-install:
    if: inputs.check == 'lite'
    name: Manual Lite ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    # Lite needs GCC/gcov, LLVM 20 format/tidy, CMake/Ninja, Python and Git; no BLAS/MKL.
    # Docker Hub alternative: vsaglib/vsag:ci-main-base
    container: ghcr.io/antgroup/vsag:ci-main-base
    strategy:
      fail-fast: false
      matrix:
        mode: [default-off, rabitq-on, sanitizer, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-lite
        with:
          mode: ${{ matrix.mode }}

  performance:
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.check == 'performance' || inputs.check == 'build-performance' }}
    uses: ./.github/workflows/daily_test.yml
    with:
      profile: ${{ inputs.check }}
      ref: ${{ inputs.ref }}
    secrets:
      PERF_DINGDING_ACCESS_TOKEN: ${{ secrets.PERF_DINGDING_ACCESS_TOKEN }}
      PERF_DINGDING_SERCRET: ${{ secrets.PERF_DINGDING_SERCRET }}
    name: Manual Performance
  toolchain-installed-client:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc13
          - clang20
        abi: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-compatibility-installed-client
        id: execute
        with:
          matrix-compiler: ${{ matrix.compiler }}
          matrix-abi: ${{ matrix.abi }}
          target-ref: ${{ inputs.ref || github.sha || github.sha }}
    if: ${{ (inputs.check == 'toolchain') && (true) }}
    permissions:
      contents: read
    name: Manual Toolchain Installed Client
  toolchain-source-baseline:
    runs-on: ubuntu-24.04
    # Retain Ubuntu 22.04 for the GCC 9 / Clang 13 source and C++17 client baseline.
    # Requires old compilers, Fortran, CMake/Ninja/Make, Git, OpenBLAS/LAPACKE,
    # libaio and LLVM 13 OpenMP; installed by toolchain-compatibility-source-baseline.
    # docker/ CI images use Ubuntu 26.04 + GCC 13/LLVM 20; dist images use manylinux.
    # Neither preserves this baseline. A future lightweight image must retain it.
    # Docker Hub official image: docker.io/library/ubuntu:22.04; no project GHCR mirror.
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc9
          - clang13
        abi: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain-compatibility-source-baseline
        id: execute
        with:
          matrix-compiler: ${{ matrix.compiler }}
          matrix-abi: ${{ matrix.abi }}
          target-ref: ${{ inputs.ref || github.sha || github.sha }}
    if: ${{ (inputs.check == 'toolchain') && (true) }}
    permissions:
      contents: read
    name: Manual Toolchain Source Baseline
