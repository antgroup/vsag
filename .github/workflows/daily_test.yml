name: Daily CI

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        default: regression
        options:
          - regression
          - performance
          - build-performance
      logical_date:
        description: Optional Asia/Shanghai YYYY-MM-DD for regression replay
        type: string
        default: ''
      ref:
        type: string
        default: main
  schedule:
    - cron: "01 08 * * 1-5" # UTC 08:01 every weekday
    - cron: '23 3 * * 1'

  workflow_call:
    inputs:
      profile:
        type: string
        default: regression
      logical_date:
        description: Optional Asia/Shanghai YYYY-MM-DD for regression replay
        type: string
        default: ''
      ref:
        type: string
        default: main
    secrets:
      CODECOV_TOKEN:
        required: false
      PERF_DINGDING_ACCESS_TOKEN:
        required: false
      PERF_DINGDING_SERCRET:
        required: false
  # Tracking: https://github.com/antgroup/vsag/issues/3065
  # Restore after validation:
  # schedule:
  #   - cron: '0 14 * * *'

jobs:
  daily-plan:
    name: Freeze Daily plan
    if: ${{ github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      simd_options: ${{ steps.plan.outputs.simd_options }}
      simd_keys: ${{ steps.plan.outputs.simd_keys }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read original run date
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            require('fs').writeFileSync('daily-run.json', JSON.stringify({
              created_at: run.data.created_at
            }));
      - name: Freeze source, date and matrix
        id: plan
        env:
          SOURCE_SHA: ${{ github.sha }}
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/testing')
          import daily_plan as p
          created = json.load(open('daily-run.json'))['created_at']
          ctx = p.context(os.environ['SOURCE_SHA'], created, os.environ['LOGICAL_DATE'] or None)
          p.write('daily-context/context.json', ctx)
          p.write('daily-context/expected-lanes.json', ['daily_test_asan_x86-unittests', 'daily_test_asan_x86-functests', 'daily_test_asan_aarch64-unittests', 'daily_test_asan_aarch64-functests', 'daily_test_asan_simd-unittests_simd', 'daily_test_asan_simd-sentinels', 'daily_test_tsan-functests', 'full-platform-test-asan-x86-unittests', 'full-platform-test-asan-x86-functests', 'full-platform-test-asan-aarch64-unittests', 'full-platform-test-asan-aarch64-functests', 'full-platform-test-asan-macos-arm64-unittests', 'full-platform-test-asan-macos-arm64-functests', 'full-platform-test-asan-macos-arm64-examples', 'full-platform-test-example-x86-examples', 'full-platform-test-example-aarch64-examples', 'full-python-test-python-x86-pytest', 'full-python-test-python-aarch64-pytest', 'full-coverage-coverage-unittests', 'full-coverage-coverage-functests', 'full-compatibility-compatibility-compatibility'])
          mode = ctx['simd_mode']
          flags = {'generic': '-DDISABLE_SSE_FORCE=1', 'sse': '-DDISABLE_AVX_FORCE=1', 'avx': '-DDISABLE_AVX2_FORCE=1'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('simd_options=' + json.dumps([mode + ';' + flags[mode]]), file=output)
              print('simd_keys=' + json.dumps([mode]), file=output)
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: daily-context-${{ github.run_id }}
          overwrite: true
          path: daily-context
          retention-days: 30
          if-no-files-found: error

  daily_build_asan_x86:
    name: Asan Build X86
    needs: daily-plan
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-x86-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_build_x86-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          save: false
          key: build-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Asan
        # Explicitly disable system selection because AUTO would use the
        # OpenBLAS installation in this image. This job guards the bundled
        # ExternalProject source-build path used by source fallback.
        env:
          CMAKE_GENERATOR: Ninja
          EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=OFF
        run: make asan COMPILE_JOBS=3 VSAG_ENABLE_EXAMPLES=ON
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: daily_test_x86-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_build_asan_aarch64:
    name: Asan Build Aarch64
    needs: daily-plan
    runs-on: ubuntu-24.04-arm
    container:
      image: vsaglib/vsag:ci-aarch64-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_build_aarch-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          save: false
          key: build-aarch-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Asan
        run: export CMAKE_GENERATOR="Ninja"; make asan COMPILE_JOBS=3 VSAG_ENABLE_EXAMPLES=ON
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build/
          name: daily_test_aarch64-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_test_asan_x86:
    name: Test X86
    needs: [daily-plan, daily_build_asan_x86]
    runs-on: ubuntu-24.04
    concurrency:
      group: daily_test_x86-${{ matrix.test_type }}-${{ github.run_id }}
      cancel-in-progress: false
    strategy:
      matrix:
        test_type: [unittests, functests]
    container:
      # Matches daily_build_asan_x86: the test binaries were built against the
      # from-source OpenBLAS (statically linked), so any image with the rest
      # of the runtime would do. We pick ci-x86-openblas for consistency.
      image: vsaglib/vsag:ci-x86-openblas
      volumes:
        - /opt:/useless
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_x86
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_x86
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Daily plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: daily_test_x86-${{ github.run_id }}
          path: ./build
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          ./scripts/testing/test_parallel_by_name.sh ${{ matrix.test_type }} ~[pr]
      - name: Upload Log
        uses: actions/upload-artifact@v5
        with:
          path: ./log
          name: daily-log-x86-${{ matrix.test_type }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Upload Daily evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-results-daily_test_asan_x86-${{ matrix.test_type }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_test_asan_aarch64:
    name: Test Aarch64
    needs: [daily-plan, daily_build_asan_aarch64]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        test_type: [unittests, functests]
    container:
      image: vsaglib/vsag:ci-aarch64-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_test_aarch64-${{ matrix.test_type }}-${{ github.run_id }}
      cancel-in-progress: false
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_aarch64
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_aarch64
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Daily plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Clean Build
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: daily_test_aarch64-${{ github.run_id }}
          path: ./build
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          ./scripts/testing/test_parallel_by_name.sh ${{ matrix.test_type }} ~[pr]
      - name: Upload Log
        uses: actions/upload-artifact@v5
        with:
          path: ./log
          name: daily-log-aarch64-${{ matrix.test_type }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Upload Daily evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-results-daily_test_asan_aarch64-${{ matrix.test_type }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  asan_test_clean_up:
    name: Clean Up
    needs: [daily-plan, daily_test_asan_x86, daily_test_asan_aarch64]
    runs-on: ubuntu-24.04
    steps:
      - name: Create Empty File
        run: touch /tmp/clean_up
      - name: Overwrite Test Artifact X86
        uses: actions/upload-artifact@v5
        with:
          path: /tmp/clean_up
          name: daily_test_x86-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'
      - name: Overwrite Test Artifact Aarch64
        uses: actions/upload-artifact@v5
        with:
          path: /tmp/clean_up
          name: daily_test_aarch64-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_build_simd:
    name: Asan Build Simd
    needs: daily-plan
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    strategy:
      matrix:
        simd_option: ${{ fromJSON(needs.daily-plan.outputs.simd_options) }}
    concurrency:
      group: daily_build_simd-${{ matrix.simd_option }}-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Make Asan
        run: |
          export EXTRA_DEFINED=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $2}'`
          export EXTRA_KEY=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $1}'`
          echo ${EXTRA_DEFINED}
          echo ${EXTRA_KEY}
          echo "SIMD_KEY=${EXTRA_KEY}" >> $GITHUB_ENV
          export VSAG_ENABLE_INTEL_MKL=ON CMAKE_GENERATOR="Ninja"; make asan
          cmake --build build --target unittests_simd --parallel 3
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: daily_test_simd-${{ env.SIMD_KEY }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_test_asan_simd:
    name: Unit Test Simd
    needs: [daily-plan, daily_build_simd]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        test_type: [unittests_simd]
        simd_key: ${{ fromJSON(needs.daily-plan.outputs.simd_keys) }}
    concurrency:
      group: daily_test_simd-${{ matrix.simd_key }}-${{ matrix.test_type }}-${{ github.run_id }}
      cancel-in-progress: false
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_simd
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_simd
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Daily plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: daily_test_simd-${{ matrix.simd_key }}-${{ github.run_id }}
          path: ./build/
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          python3 scripts/testing/daily_entry.py unittests_simd simd
          python3 scripts/testing/daily_measure.py --name sentinels --owner simd -- python3 scripts/ci/platform_smoke.py functests

      - name: Upload Daily evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-results-daily_test_asan_simd-${{ matrix.test_type }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_clean_up_simd:
    name: Clean Up
    needs: [daily-plan, daily_test_asan_simd]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        simd_key: ${{ fromJSON(needs.daily-plan.outputs.simd_keys) }}
    steps:
      - name: Create Empty File
        run: touch /tmp/clean_up
      - name: Overwrite Test Artifact
        uses: actions/upload-artifact@v5
        with:
          path: /tmp/clean_up
          name: test-x86-${{ matrix.simd_key }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_build_tsan:
    name: Daily Build with TSAN
    needs: daily-plan
    runs-on: ubuntu-24.04
    concurrency:
      group: daily_build_tsan_x86-${{ github.run_id }}
      cancel-in-progress: false
    container:
      image: vsaglib/vsag:ci-x86-mkl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          save: false
          key: build-tsan-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Tsan
        env:
          VSAG_OPENBLAS_TARGET: GENERIC
        run: export CMAKE_GENERATOR="Ninja"; make tsan COMPILE_JOBS=3
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: daily_test_x86-${{ github.run_id }}-tsan
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  daily_test_tsan:
    name: Daily Run TSAN Tests
    needs: [daily-plan, daily_build_tsan]
    runs-on: ubuntu-24.04
    concurrency:
      group: daily_test_tsan_x86-${{ github.run_id }}
      cancel-in-progress: false
    container:
      image: vsaglib/vsag:ci-x86-mkl
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_tsan
      VSAG_DAILY_ENVIRONMENT: daily_test_tsan
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen Daily plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: daily_test_x86-${{ github.run_id }}-tsan
          path: ./build/
      - name: Run TSAN tests
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          echo race:libomp.so > omp.supp
          echo race:libomp.so.5 >> omp.supp
          echo race:fmt::v10::detail::format_decimal >> omp.supp
          echo "race:libmkl_intel_thread.so.2" >> omp.supp
          export TSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/functests
          python3 scripts/testing/daily_entry.py functests concurrent

      - name: Upload Daily evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-results-daily_test_tsan-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  full-platform-build-asan-x86:
    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (!false) }}
    name: Asan Build X86
    needs: daily-plan
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    concurrency:
      group: asan_build_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-x86
        id: execute
  full-platform-build-asan-aarch64:
    name: Asan Build Aarch64
    needs: daily-plan
    runs-on: ubuntu-24.04-arm
    container:
      image: vsaglib/vsag:ci-aarch64-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: asan_build_aarch-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-aarch64
        id: execute
    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  full-platform-build-asan-macos-arm64:
    name: Asan Build macOS arm64
    needs: daily-plan
    runs-on: macos-15
    concurrency:
      group: asan_build_macos-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf "${RUNNER_TOOL_CACHE:-/Users/runner/hostedtoolcache}"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-macos-arm64
        id: execute
    if: ${{ (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (true) }}
  full-platform-test-asan-x86:
    if: ${{ ((github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')) && (!false)) && needs.full-platform-build-asan-x86.result == 'success' }}
    name: Test X86
    needs:
      - daily-plan
      - full-platform-build-asan-x86
    runs-on: ubuntu-24.04
    concurrency:
      group: test_asan_x86-${{ matrix.test_type }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        test_type:
          - unittests
          - functests
    container:
      image: vsaglib/vsag:ci-x86-mkl
      volumes:
        - /opt:/useless
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: full-platform-test-asan-x86
      VSAG_DAILY_ENVIRONMENT: full-platform-test-asan-x86
      VSAG_DAILY_CORE_ONLY: "1"
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Download frozen Daily plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - uses: ./.github/actions/asan-build-and-test-test-asan-x86
        id: execute
        with:
          matrix-test-type: ${{ matrix.test_type }}
      - name: Upload Daily evidence
        if: always()
