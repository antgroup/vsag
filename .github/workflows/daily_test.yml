        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ ((((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true)) && needs.full-python-test-python-x86.result == 'success' && needs.full-python-test-python-aarch64.result == 'success' }}
  full-lint-clang-tidy-check:
    timeout-minutes: 300
    name: Lint
    needs: daily-plan
    runs-on: ubuntu-latest
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
    env:
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Check build/lint execution window
        id: window
        uses: ./.github/actions/daily-execution-window
      - uses: ./.github/actions/lint-clang-tidy-check
        timeout-minutes: ${{ fromJSON(steps.window.outputs.remaining_minutes) }}
        id: execute
        with:
          inputs-mode: ${{ 'full' }}
          inputs-pattern: ${{ '' }}
      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  full-coverage-changes:
    timeout-minutes: 300
    name: Detect Changes
    needs: daily-plan
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.execute.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/coverage-changes
        id: execute
      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  full-coverage-coverage:
    timeout-minutes: 300
    name: Coverage — C++ lines and branches
    needs:
      - daily-plan
      - full-coverage-changes
    if: ${{ ((((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (github.event_name != 'push' || needs.full-coverage-changes.outputs.non_markdown == 'true')) && needs.full-coverage-changes.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: full-coverage-coverage
      VSAG_DAILY_ENVIRONMENT: full-coverage-coverage
      VSAG_DAILY_COVERAGE: "1"
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
      VSAG_TEST_SEED: 424242
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Refresh execution window for this attempt
        uses: ./.github/actions/daily-execution-window
      - uses: ./.github/actions/coverage-coverage
        id: execute
        with:
          secrets-CODECOV-TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-full-coverage-coverage-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error
      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

  full-compatibility-compatibility:
    timeout-minutes: 300
    name: Check Compatibility
    needs: daily-plan
    runs-on: ubuntu-latest
    concurrency:
      group: compatibility-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: full-compatibility-compatibility
      VSAG_DAILY_ENVIRONMENT: full-compatibility-compatibility
      COMPATIBILITY_INDEX_DIR: ${{ github.workspace }}/.ci-compatibility-inputs
    steps:
      - name: Install GitHub CLI
        env:
          GH_VERSION: 2.75.0
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          wget --tries=3 --timeout=30 -q "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -O /tmp/gh.tar.gz
          tar xzf /tmp/gh.tar.gz -C /tmp
          install -m 0755 /tmp/gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/gh
          rm -rf /tmp/gh.tar.gz /tmp/gh_${GH_VERSION}_linux_amd64
          gh --version
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Refresh execution window for this attempt
        uses: ./.github/actions/daily-execution-window
      - uses: ./.github/actions/check-compatibility-compatibility
        id: execute
      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-full-compatibility-compatibility-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  performance-benchmarks:
    name: Performance benchmarks
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.repository == 'antgroup/vsag' && github.event.schedule == '23 3 * * 1') || (github.event_name != 'schedule' && (inputs.profile == 'build-performance' || (inputs.profile == 'performance' && github.repository == 'antgroup/vsag')))) }}
    uses: ./.github/workflows/nightly-performance.yml
    with:
      profile: ${{ inputs.profile || 'build-performance' }}
      ref: ${{ inputs.ref || 'main' }}
    secrets:
      PERF_DINGDING_ACCESS_TOKEN: ${{ secrets.PERF_DINGDING_ACCESS_TOKEN }}
      PERF_DINGDING_SERCRET: ${{ secrets.PERF_DINGDING_SERCRET }}

  daily-extra-plan:
    if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression'))) }}
    name: Plan X86 Extra Coverage quota
    timeout-minutes: 10
    needs: [daily-plan, daily_test_asan_x86, daily_test_asan_aarch64, daily_test_asan_simd, daily_test_tsan, full-platform-test-asan-x86, full-platform-test-asan-macos-arm64, full-platform-test-example-x86, full-platform-test-example-aarch64, full-python-test-python-x86, full-python-test-python-aarch64, full-coverage-coverage, full-compatibility-compatibility, full-lint-clang-tidy-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: daily-results-daily_test_asan_x86-functests-shard*-${{ github.run_id }}
          path: daily-base-results
      - name: Read current attempt clock
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id: context.runId});
            require('fs').writeFileSync('daily-extra-clock.json', JSON.stringify({started_at: run.data.run_started_at}));
      - name: Freeze disjoint candidates and remaining quota
        run: python3 scripts/testing/daily_extra.py plan --collect daily-base-results --clock daily-extra-clock.json --proposal daily-extra-proposal.json
      - uses: actions/upload-artifact@v6
        with:
          name: daily-extra-proposal-${{ github.run_id }}
          path: daily-extra-proposal.json
          overwrite: true
          retention-days: 30
          if-no-files-found: error
      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

  daily-extra-x86:
    if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression'))) }}
    name: X86 Extra Coverage shard ${{ matrix.shard }}
    timeout-minutes: 270
    needs: [daily-plan, daily-extra-plan]
    runs-on: ubuntu-24.04
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.daily-plan.outputs.x86_shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-extra-proposal-${{ github.run_id }}
          path: .
      - name: Check remaining supplemental time
        id: extra
        run: |
          python3 - <<'PYCODE'
          import datetime as dt, os, sys
          sys.path.insert(0, 'scripts/testing')
          import daily_extra, daily_plan as dp
          p = daily_extra.validate(dp.load('daily-extra-proposal.json'))
          available = (daily_extra.timestamp(p['cutoff']) - dt.datetime.now(dt.timezone.utc)).total_seconds() > 900
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('available=' + str(available).lower(), file=output)
          PYCODE
      - name: Reuse verified X86 build
        if: steps.extra.outputs.available == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily_test_x86-${{ github.run_id }}
          path: build
      - name: Execute extras within remaining quota
        env:
          EXTRA_SHARD: ${{ matrix.shard }}
          EXTRA_AVAILABLE: ${{ steps.extra.outputs.available }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          python3 scripts/testing/daily_extra.py run --proposal daily-extra-proposal.json --shard "$EXTRA_SHARD" --output "daily-results/daily-extra-x86-functests-shard$EXTRA_SHARD"
      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-extra-x86-shard${{ matrix.shard }}-${{ github.run_id }}
          path: daily-results
          overwrite: true
          retention-days: 30
          if-no-files-found: error
      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

  daily-summary:
    timeout-minutes: 30
    name: Nightly Summary
    if: ${{ always() && (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) }}
    # The needs context omits indirect dependencies. Include supplemental prerequisites
    # so their failures are visible even when the dependent test jobs are skipped.
    needs: [daily-plan, daily_build_asan_x86, daily_build_asan_aarch64, daily_build_simd, daily_build_tsan, full-platform-build-asan-x86, full-platform-build-asan-macos-arm64, full-python-build-python-wheel-x86, full-python-build-python-wheel-aarch64, full-coverage-changes, daily_test_asan_x86, daily_test_asan_aarch64, daily_test_asan_simd, daily_test_tsan, full-platform-test-asan-x86, full-platform-test-asan-macos-arm64, full-platform-test-example-x86, full-platform-test-example-aarch64, full-python-test-python-x86, full-python-test-python-aarch64, full-coverage-coverage, full-compatibility-compatibility, full-lint-clang-tidy-check, daily-extra-plan, daily-extra-x86]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: daily-results-*-${{ github.run_id }}
          path: daily-collected
      - name: Download extra quota plan
        if: ${{ always() && needs.daily-extra-plan.result != 'skipped' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-extra-proposal-${{ github.run_id }}
          path: .
      - name: Download per-job diagnostics
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: daily-job-*-${{ github.run_id }}
          path: daily-job-collected
      - name: Download Python environment reports
        if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: python-report-full-python-test-python-*
          path: python-collected
      - name: Collect workflow elapsed and job timings
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id: context.runId});
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: context.runId, filter: 'latest', per_page: 100});
            require('fs').writeFileSync('daily-job-metrics.json', JSON.stringify({
              started_at: run.data.run_started_at, observed_at: new Date().toISOString(),
              jobs: jobs.map(({name, started_at, completed_at, conclusion, steps}) =>
                ({name, started_at, completed_at, conclusion,
                  steps: (steps || []).map(({name, started_at, completed_at, conclusion}) =>
                    ({name, started_at, completed_at, conclusion}))}))
            }));
      - name: Reconcile every expected lane
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/testing/daily_report.py --collect daily-collected --metrics daily-job-metrics.json --extra-proposal daily-extra-proposal.json --job-reports daily-job-collected --python-reports python-collected --expected-file daily-context/expected-lanes.json --summary "$GITHUB_STEP_SUMMARY" --json daily-summary.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daily-summary-${{ github.run_id }}
          overwrite: true
          path: |
            daily-summary.json
            daily-job-metrics.json
          retention-days: 30
          if-no-files-found: error

  publish-coverage-badge:
    name: Publish Nightly C++ line coverage badge
    needs: [daily-summary, full-coverage-coverage]
    if: ${{ always() && !cancelled() && github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main' && needs.full-coverage-coverage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A badge publication error must not change the regression conclusion.
    continue-on-error: true
    permissions:
      actions: read
      contents: write
    concurrency:
      group: nightly-coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read the current Nightly run
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            if (run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) {
              throw new Error('Nightly run attempt changed before badge publication');
            }
            require('fs').writeFileSync(process.env.RUNNER_TEMP + '/nightly-run.json', JSON.stringify(run));
      - name: Download the Coverage job report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-job-full-coverage-coverage-0-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-coverage-report
      - name: Update the badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          badge_repo=$(mktemp -d)
          git init --quiet --initial-branch=nightly-coverage-badge "$badge_repo"
          git -C "$badge_repo" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$badge_repo" config credential.helper '!gh auth git-credential'

          if git -C "$badge_repo" ls-remote --exit-code origin refs/heads/nightly-coverage-badge >/dev/null; then
            git -C "$badge_repo" fetch --quiet --depth=1 origin refs/heads/nightly-coverage-badge
            git -C "$badge_repo" reset --quiet --hard FETCH_HEAD
          else
            test "$?" -eq 2
          fi

          python3 scripts/testing/nightly_coverage_badge.py "$RUNNER_TEMP/nightly-run.json" \
            "$RUNNER_TEMP/nightly-coverage-report/job-report.json" "$badge_repo"
          git -C "$badge_repo" add README.md badge.json source.json
          if git -C "$badge_repo" diff --cached --quiet; then
            exit 0
          fi

          git -C "$badge_repo" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'ci: update Nightly C++ line coverage'
          git -C "$badge_repo" push origin HEAD:refs/heads/nightly-coverage-badge

permissions:
  contents: read
  actions: read
