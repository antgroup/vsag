name: Nightly CI

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        default: regression
        options:
          - regression
          - performance
          - build-performance
      logical_date:
        description: Optional Asia/Shanghai YYYY-MM-DD for regression replay
        type: string
        default: ''
      ref:
        type: string
        default: main
  schedule:
    - cron: '0 14 * * *' # 22:00 Asia/Shanghai: full regression
    - cron: '23 3 * * 1' # Weekly build-performance benchmark (unchanged)

env:
  VSAG_DAILY_AGGREGATE: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression'))) && '1' || '0' }}

jobs:
  daily-plan:
    name: Freeze Nightly plan
    if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression'))) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      x86_shards: ${{ steps.plan.outputs.x86_shards }}
      x86_shard_count: ${{ steps.plan.outputs.x86_shard_count }}
      simd_options: ${{ steps.plan.outputs.simd_options }}
      simd_keys: ${{ steps.plan.outputs.simd_keys }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preflight Nightly parameter inventory
        run: python3 scripts/testing/daily_parameters.py
      - name: Read original run date
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            require('fs').writeFileSync('daily-run.json', JSON.stringify({
              created_at: run.data.created_at
            }));
      - name: Freeze source, date and matrix
        id: plan
        env:
          SOURCE_SHA: ${{ github.sha }}
          LOGICAL_DATE: ${{ inputs.logical_date }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/testing')
          import daily_plan as p
          sys.path.insert(0, 'scripts/ci')
          import python_ci
          created = json.load(open('daily-run.json'))['created_at']
          ctx = p.context(os.environ['SOURCE_SHA'], created, os.environ['LOGICAL_DATE'] or None)
          p.write('daily-context/context.json', ctx)
          p.write('daily-context/expected-lanes.json', ['daily_test_asan_aarch64-unittests', 'daily_test_asan_aarch64-functests', 'daily_test_asan_simd-unittests_simd', 'daily_test_asan_simd-sentinels', 'daily_test_tsan-functests', 'full-platform-test-asan-x86-unittests', 'full-platform-test-asan-x86-functests', 'full-platform-test-asan-macos-arm64-unittests', 'full-platform-test-asan-macos-arm64-functests', 'full-platform-test-asan-macos-arm64-examples', 'full-platform-test-example-x86-examples', 'full-platform-test-example-aarch64-examples', 'full-coverage-coverage-unittests', 'full-coverage-coverage-functests', 'full-compatibility-compatibility-compatibility'])
          expected = p.load('daily-context/expected-lanes.json') + python_ci.lanes()
          shard_count = p.policy()['x86_shards']
          expected += [f'daily_test_asan_x86-{binary}-shard{i}' for binary in ('unittests', 'functests') for i in range(shard_count)]
          expected += [f'daily-extra-x86-functests-shard{i}' for i in range(shard_count)]
          p.write('daily-context/expected-lanes.json', expected)
          mode = ctx['simd_mode']
          flags = {'generic': '-DDISABLE_SSE_FORCE=1', 'sse': '-DDISABLE_AVX_FORCE=1', 'avx': '-DDISABLE_AVX2_FORCE=1'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('python_matrix=' + json.dumps({'include': python_ci.environments()}), file=output)
              print('x86_shards=' + json.dumps(list(range(shard_count))), file=output)
              print('x86_shard_count=' + str(shard_count), file=output)
              print('simd_options=' + json.dumps([mode + ';' + flags[mode]]), file=output)
              print('simd_keys=' + json.dumps([mode]), file=output)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: daily-context-${{ github.run_id }}
          overwrite: true
          path: daily-context
          retention-days: 30
          if-no-files-found: error

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

  daily_build_asan_x86:
    timeout-minutes: 300
    name: ASan Build X86 OpenBLAS source
    needs: daily-plan
    runs-on: ubuntu-24.04
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_build_x86-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          job-summary: ${{ env.VSAG_DAILY_AGGREGATE != '1' && 'CCache Statistics' || '' }}
          max-size: "2G"
          save: ${{ github.event_name == 'schedule' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main' }}
          key: build-x86-asan-openblas-source-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Check build/lint execution window
        id: window
        uses: ./.github/actions/daily-execution-window
      - name: Make Asan
        timeout-minutes: ${{ fromJSON(steps.window.outputs.remaining_minutes) }}
        # Explicitly disable system selection because AUTO would use the
        # OpenBLAS installation in this image. This job guards the bundled
        # ExternalProject source-build path used by source fallback.
        env:
          CMAKE_GENERATOR: Ninja
          EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=OFF
        run: make asan COMPILE_JOBS=3 VSAG_ENABLE_EXAMPLES=ON
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v6
        with:
          path: ./build
          name: daily_test_x86-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_build_asan_aarch64:
    timeout-minutes: 300
    name: Asan Build Aarch64
    needs: daily-plan
    runs-on: ubuntu-24.04-arm
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_build_aarch-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          job-summary: ${{ env.VSAG_DAILY_AGGREGATE != '1' && 'CCache Statistics' || '' }}
          max-size: "2G"
          save: false
          key: build-aarch-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Check build/lint execution window
        id: window
        uses: ./.github/actions/daily-execution-window
      - name: Make Asan
        timeout-minutes: ${{ fromJSON(steps.window.outputs.remaining_minutes) }}
        run: export CMAKE_GENERATOR="Ninja"; make asan COMPILE_JOBS=3 DATACELL_COMPILE_JOBS=1 VSAG_ENABLE_EXAMPLES=ON
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v6
        with:
          path: ./build/
          name: daily_test_aarch64-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_test_asan_x86:
    name: X86 ${{ matrix.test_type }} shard ${{ matrix.shard }}
    timeout-minutes: 300
    needs: [daily-plan, daily_build_asan_x86]
    runs-on: ubuntu-24.04
    concurrency:
      group: daily_test_x86-${{ matrix.test_type }}-${{ matrix.shard }}-${{ github.run_id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        test_type: [unittests, functests]
        shard: ${{ fromJSON(needs.daily-plan.outputs.x86_shards) }}
    container:
      # Matches daily_build_asan_x86: the test binaries were built against the
      # from-source OpenBLAS (statically linked), so any image with the rest
      # of the runtime would do. We pick ci-main-openblas for consistency.
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_x86
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_x86
      VSAG_DAILY_SHARD_INDEX: ${{ matrix.shard }}
      VSAG_DAILY_SHARD_COUNT: ${{ needs.daily-plan.outputs.x86_shard_count }}
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Refresh execution window for this attempt
        uses: ./.github/actions/daily-execution-window
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v7
        with:
          name: daily_test_x86-${{ github.run_id }}
          path: ./build
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          ./scripts/testing/test_parallel_by_name.sh ${{ matrix.test_type }} ~[pr]
      - name: Upload Log
        uses: actions/upload-artifact@v6
        with:
          path: ./log
          name: daily-log-x86-${{ matrix.test_type }}-${{ matrix.shard }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-daily_test_asan_x86-${{ matrix.test_type }}-shard${{ matrix.shard }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_test_asan_aarch64:
    timeout-minutes: 300
    name: ARM core and weekly extensions
    needs: [daily-plan, daily_build_asan_aarch64]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        test_type: [unittests, functests]
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-openblas
      image: ghcr.io/antgroup/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: daily_test_aarch64-${{ matrix.test_type }}-${{ github.run_id }}
      cancel-in-progress: false
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_aarch64
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_aarch64
      VSAG_DAILY_WORKERS: "1"
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Refresh execution window for this attempt
        uses: ./.github/actions/daily-execution-window
      - name: Clean Build
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v7
        with:
          name: daily_test_aarch64-${{ github.run_id }}
          path: ./build
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          ./scripts/testing/test_parallel_by_name.sh ${{ matrix.test_type }} ~[pr]
      - name: Upload Log
        uses: actions/upload-artifact@v6
        with:
          path: ./log
          name: daily-log-aarch64-${{ matrix.test_type }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-daily_test_asan_aarch64-${{ matrix.test_type }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_build_simd:
    timeout-minutes: 300
    name: Asan Build Simd
    needs: daily-plan
    runs-on: ubuntu-24.04
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-mkl
      image: ghcr.io/antgroup/vsag:ci-main-mkl
      volumes:
        - /opt:/useless
    strategy:
      fail-fast: false
      matrix:
        simd_option: ${{ fromJSON(needs.daily-plan.outputs.simd_options) }}
    concurrency:
      group: daily_build_simd-${{ matrix.simd_option }}-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Check build/lint execution window
        id: window
        uses: ./.github/actions/daily-execution-window
      - name: Make Asan
        timeout-minutes: ${{ fromJSON(steps.window.outputs.remaining_minutes) }}
        run: |
          export EXTRA_DEFINED=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $2}'`
          export EXTRA_KEY=`echo "${{ matrix.simd_option }}" | awk -F';' '{print $1}'`
          echo ${EXTRA_DEFINED}
          echo ${EXTRA_KEY}
          echo "SIMD_KEY=${EXTRA_KEY}" >> $GITHUB_ENV
          export VSAG_ENABLE_INTEL_MKL=ON CMAKE_GENERATOR="Ninja"
          python3 scripts/ci/monitor_build.py --output-dir "$RUNNER_TEMP/simd-build-diagnostics/asan" -- \
            make asan COMPILE_JOBS=3 DATACELL_COMPILE_JOBS=1
          python3 scripts/ci/monitor_build.py --output-dir "$RUNNER_TEMP/simd-build-diagnostics/simd" -- \
            cmake --build build --target unittests_simd --parallel 3
      - name: Upload SIMD build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          path: ${{ runner.temp }}/simd-build-diagnostics/
          name: simd-build-diagnostics-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v6
        with:
          path: ./build
          name: daily_test_simd-${{ env.SIMD_KEY }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_test_asan_simd:
    timeout-minutes: 300
    name: Unit Test Simd
    needs: [daily-plan, daily_build_simd]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_type: [unittests_simd]
        simd_key: ${{ fromJSON(needs.daily-plan.outputs.simd_keys) }}
    concurrency:
      group: daily_test_simd-${{ matrix.simd_key }}-${{ matrix.test_type }}-${{ github.run_id }}
      cancel-in-progress: false
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-mkl
      image: ghcr.io/antgroup/vsag:ci-main-mkl
      volumes:
        - /opt:/useless
    env:
      VSAG_DAILY_CONTEXT: ${{ github.workspace }}/daily-context/context.json
      VSAG_DAILY_LANE: daily_test_asan_simd
      VSAG_DAILY_ENVIRONMENT: daily_test_asan_simd
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download frozen Nightly plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-context-${{ github.run_id }}
          path: daily-context
      - name: Refresh execution window for this attempt
        uses: ./.github/actions/daily-execution-window
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v7
        with:
          name: daily_test_simd-${{ matrix.simd_key }}-${{ github.run_id }}
          path: ./build/
      - name: Do Asan Test In ${{ matrix.test_type }}
        run: |
          echo leak:libomp.so > omp.supp
          export LSAN_OPTIONS="suppressions=$(pwd)/omp.supp"
          chmod +x ./build/tests/${{ matrix.test_type }}
          python3 scripts/testing/daily_entry.py unittests_simd simd
          python3 scripts/testing/daily_measure.py --name sentinels --owner simd -- python3 scripts/ci/platform_smoke.py functests

      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-results-daily_test_asan_simd-${{ matrix.test_type }}-${{ github.run_id }}
          overwrite: true
          path: daily-results
          retention-days: 30
          if-no-files-found: error

      - name: Capture Nightly job diagnostics
        if: always()
        uses: ./.github/actions/daily-job-report
        env:
          DAILY_JOB_STATUS: ${{ job.status }}
          DAILY_JOB_MATRIX: ${{ toJSON(matrix) }}

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_clean_up_simd:
    timeout-minutes: 300
    name: Clean Up
    needs: [daily-plan, daily_test_asan_simd]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd_key: ${{ fromJSON(needs.daily-plan.outputs.simd_keys) }}
    steps:
      - name: Create Empty File
        run: touch /tmp/clean_up
      - name: Overwrite Test Artifact
        uses: actions/upload-artifact@v6
        with:
          path: /tmp/clean_up
          name: test-x86-${{ matrix.simd_key }}-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

    if: ${{ (((github.event_name == 'schedule' && github.event.schedule == '0 14 * * *' && github.repository == 'antgroup/vsag' && github.ref == 'refs/heads/main') || (github.event_name != 'schedule' && (inputs.profile == '' || inputs.profile == 'regression')))) && (true) }}
  daily_build_tsan:
    timeout-minutes: 300
    name: Nightly Build with TSAN
    needs: daily-plan
    runs-on: ubuntu-24.04
    concurrency:
      group: daily_build_tsan_x86-${{ github.run_id }}
      cancel-in-progress: false
    container:
      # Docker Hub alternative: vsaglib/vsag:ci-main-mkl
      image: ghcr.io/antgroup/vsag:ci-main-mkl
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          job-summary: ${{ env.VSAG_DAILY_AGGREGATE != '1' && 'CCache Statistics' || '' }}
          max-size: "2G"
          save: false
