name: Branch CI

on:
  push:
    branches: [main, '0.*']
  workflow_call:
    inputs:
      profile:
        type: string
        default: full-branch
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# No branch-wide concurrency: every main commit keeps its own run.
jobs:
  changes:
    if: ${{ github.event.deleted != true && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && (inputs.profile == '' || inputs.profile == 'full-branch') }}
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.policy.outputs.heavy }}
      python: ${{ steps.policy.outputs.python }}
      lint: ${{ steps.policy.outputs.lint }}
      pattern: ${{ steps.policy.outputs.pattern }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select main checks
        id: policy
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/ci/main_ci_policy.py

  summary:
    name: Branch Summary
    if: ${{ always() && github.event.deleted != true && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && (inputs.profile == '' || inputs.profile == 'full-branch') }}
    needs: [changes, platforms, python, tsan, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected checks
        env:
          MAIN_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/main_ci_summary.py

  select-checks:
    if: ${{ github.event.deleted != true && (inputs.profile == '' || inputs.profile == 'full-branch') }}
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.select.outputs.format }}
      docs: ${{ steps.select.outputs.docs }}
      issue: ${{ steps.select.outputs.issue }}
      simd: ${{ steps.select.outputs.simd }}
      lite: ${{ steps.select.outputs.lite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select original event and path scopes
        id: select
        run: python3 scripts/ci/checks_policy.py

  clang-format-check:
    needs: select-checks
    if: ${{ always() && (inputs.profile == '' || inputs.profile == 'full-branch') }}
    name: ${{ matrix.check }}
    strategy:
      matrix:
        check: ${{ fromJSON((github.event.deleted != true && (needs.select-checks.result != 'success' || needs.select-checks.outputs.format == 'true')) && '["Format Check"]' || '["Format Check Not Required"]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful check selection
        if: matrix.check == 'Format Check'
        env:
          SELECTION_RESULT: ${{ needs.select-checks.result }}
        run: |
          if [ "$SELECTION_RESULT" != success ]; then
            echo '::error::Check selection did not succeed; formatting cannot be declared unnecessary.'
            exit 1
          fi
      - name: Checkout code
        if: matrix.check == 'Format Check'
        uses: actions/checkout@v4
      - uses: ./.github/actions/check-format
        if: matrix.check == 'Format Check'

  validate:
    needs: select-checks
    if: ${{ always() && (inputs.profile == '' || inputs.profile == 'full-branch') }}
    name: ${{ matrix.check }}
    strategy:
      matrix:
        check: ${{ fromJSON((github.event.deleted != true && github.ref == 'refs/heads/main' && (needs.select-checks.result != 'success' || needs.select-checks.outputs.docs == 'true')) && '["Branch Docs"]' || '["Branch Docs Not Required"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful check selection
        if: matrix.check == 'Branch Docs'
        env:
          SELECTION_RESULT: ${{ needs.select-checks.result }}
        run: |
          if [ "$SELECTION_RESULT" != success ]; then
            echo '::error::Check selection did not succeed; documentation checks cannot be declared unnecessary.'
            exit 1
          fi
      - name: Checkout repository
        if: matrix.check == 'Branch Docs'
        uses: actions/checkout@v4
      - uses: ./.github/actions/check-docs
        if: matrix.check == 'Branch Docs'
  entry-scope:
    name: Select branch profile
    runs-on: ubuntu-latest
    outputs:
      non_docs: ${{ steps.scope.outputs.non_docs }}
      version: ${{ steps.scope.outputs.version }}
      simd: ${{ steps.scope.outputs.simd }}
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          PROFILE: ${{ inputs.profile || 'full-branch' }}
        run: python3 scripts/ci/branch_entry_policy.py
  platforms-build-asan-x86:
    if: ${{ (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!(needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'))) }}
    name: Asan Build X86
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-main-mkl
      volumes:
        - /opt:/useless
    concurrency:
      group: asan_build_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-x86
        id: execute
    needs:
      - entry-scope
      - changes
  platforms-build-asan-aarch64:
    name: Asan Build Aarch64
    runs-on: ubuntu-24.04-arm
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: asan_build_aarch-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-aarch64
        id: execute
    needs:
      - entry-scope
      - changes
    if: ${{ (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true) }}
  platforms-build-asan-macos-arm64:
    name: Asan Build macOS arm64
    runs-on: macos-15
    concurrency:
      group: asan_build_macos-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        run: rm -rf "${RUNNER_TOOL_CACHE:-/Users/runner/hostedtoolcache}"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-build-asan-macos-arm64
        id: execute
    needs:
      - entry-scope
      - changes
    if: ${{ (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true) }}
  platforms-test-asan-x86:
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!(needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')))) && needs.platforms-build-asan-x86.result == 'success' }}
    name: Test X86
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-x86
    runs-on: ubuntu-24.04
    concurrency:
      group: test_asan_x86-${{ matrix.test_type }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        test_type:
          - unittests
          - functests
    container:
      image: vsaglib/vsag:ci-main-mkl
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-test-asan-x86
        id: execute
        with:
          matrix-test-type: ${{ matrix.test_type }}
  platforms-test-asan-aarch64:
    name: Test Aarch64
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-aarch64
    env:
      SMOKE: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        test_type:
          - unittests
          - functests
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: test_asan_aarch64-${{ matrix.test_type }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-test-asan-aarch64
        id: execute
        with:
          matrix-test-type: ${{ matrix.test_type }}
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true)) && needs.platforms-build-asan-aarch64.result == 'success' }}
  platforms-test-asan-macos-arm64:
    name: Test macOS arm64
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-macos-arm64
    env:
      SMOKE: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
      FULL_EXAMPLES: ${{ false }}
    runs-on: macos-15
    strategy:
      matrix:
        test_type:
          - unittests
          - functests
    concurrency:
      group: test_asan_macos-${{ matrix.test_type }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-test-asan-macos-arm64
        id: execute
        with:
          matrix-test-type: ${{ matrix.test_type }}
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true)) && needs.platforms-build-asan-macos-arm64.result == 'success' }}
  platforms-test-example-x86:
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!(needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')))) && needs.platforms-build-asan-x86.result == 'success' }}
    name: Test Example X86
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-x86
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-main-mkl
      volumes:
        - /opt:/useless
    concurrency:
      group: test_example_x86--${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-test-example-x86
        id: execute
  platforms-test-example-aarch64:
    name: Test Example Aarch64
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-aarch64
    env:
      SMOKE: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-24.04-arm
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    concurrency:
      group: test_example_aarch64--${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/asan-build-and-test-test-example-aarch64
        id: execute
        with:
          inputs-smoke: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) }}
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true)) && needs.platforms-build-asan-aarch64.result == 'success' }}
  platforms-clean-up:
    if: ${{ ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!false)) && needs.platforms-test-asan-x86.result == 'success' && needs.platforms-test-asan-aarch64.result == 'success' && needs.platforms-test-asan-macos-arm64.result == 'success' }}
    name: Clean Up
    needs:
      - entry-scope
      - changes
      - platforms-test-asan-x86
      - platforms-test-asan-aarch64
      - platforms-test-asan-macos-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/asan-build-and-test-clean-up
        id: execute
  platforms:
    name: Platforms result
    if: ${{ always() && (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'asan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) }}
    needs:
      - entry-scope
      - changes
      - platforms-build-asan-x86
      - platforms-build-asan-aarch64
      - platforms-build-asan-macos-arm64
      - platforms-test-asan-x86
      - platforms-test-asan-aarch64
      - platforms-test-asan-macos-arm64
      - platforms-test-example-x86
      - platforms-test-example-aarch64
      - platforms-clean-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete selected results
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && '["platforms-build-asan-aarch64", "platforms-build-asan-macos-arm64", "platforms-test-asan-aarch64", "platforms-test-asan-macos-arm64", "platforms-test-example-aarch64"]' || '["platforms-build-asan-x86", "platforms-build-asan-aarch64", "platforms-build-asan-macos-arm64", "platforms-test-asan-x86", "platforms-test-asan-aarch64", "platforms-test-asan-macos-arm64", "platforms-test-example-x86", "platforms-test-example-aarch64"]' }}
        run: python3 scripts/ci/check_job_results.py
  # Main-push Python is paused until #3295 upgrades packaging; manual/version checks remain.
  python-build-python-wheel-x86:
    name: Python Wheel Build X86
    runs-on: ubuntu-24.04
    concurrency:
      group: python_build_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-build-and-test-build-python-wheel-x86
        id: execute
    needs:
      - entry-scope
      - changes
    if: ${{ needs.changes.outputs.python != 'false' && (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true) }}
  python-build-python-wheel-aarch64:
    if: ${{ needs.changes.outputs.python != 'false' && (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!(needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'))) }}
    name: Python Wheel Build Aarch64
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: python_build_aarch64-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-build-and-test-build-python-wheel-aarch64
        id: execute
    needs:
      - entry-scope
      - changes
  python-test-python-x86:
    name: Test Python X86
    needs:
      - entry-scope
      - changes
      - python-build-python-wheel-x86
    runs-on: ubuntu-24.04
    concurrency:
      group: test_python_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-build-and-test-test-python-x86
        id: execute
    if: ${{ needs.changes.outputs.python != 'false' && ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true)) && needs.python-build-python-wheel-x86.result == 'success' }}
  python-test-python-aarch64:
    if: ${{ needs.changes.outputs.python != 'false' && ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (!(needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')))) && needs.python-build-python-wheel-aarch64.result == 'success' }}
    name: Test Python Aarch64
    needs:
      - entry-scope
      - changes
      - python-build-python-wheel-aarch64
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: test_python_aarch64-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-build-and-test-test-python-aarch64
        id: execute
  python-clean-up:
    name: Clean Up
    needs:
      - entry-scope
      - changes
      - python-test-python-x86
      - python-test-python-aarch64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-build-and-test-clean-up
        id: execute
    if: ${{ needs.changes.outputs.python != 'false' && ((!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true)) && needs.python-test-python-x86.result == 'success' && needs.python-test-python-aarch64.result == 'success' }}
  python:
    name: Python result
    if: ${{ needs.changes.outputs.python != 'false' && always() && (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'python' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) }}
    needs:
      - entry-scope
      - changes
      - python-build-python-wheel-x86
      - python-build-python-wheel-aarch64
      - python-test-python-x86
      - python-test-python-aarch64
      - python-clean-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete selected results
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: ${{ (needs.entry-scope.outputs.profile == 'full-branch' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && '["python-build-python-wheel-x86", "python-test-python-x86"]' || '["python-build-python-wheel-x86", "python-build-python-wheel-aarch64", "python-test-python-x86", "python-test-python-aarch64"]' }}
        run: python3 scripts/ci/check_job_results.py
  tsan-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.execute.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tsan-build-and-test-changes
        id: execute
    needs:
      - entry-scope
      - changes
    if: ${{ (!cancelled() && (needs.entry-scope.result == 'success' && (needs.entry-scope.outputs.profile == 'tsan' || (needs.entry-scope.outputs.profile == 'full-branch' && ((needs.entry-scope.outputs.version == 'true' && needs.entry-scope.outputs.non_docs == 'true') || needs.changes.outputs.heavy == 'true'))))) && (true) }}
  tsan-build-tsan:
    name: Build with TSAN
    needs:
      - entry-scope
      - changes
      - tsan-changes
