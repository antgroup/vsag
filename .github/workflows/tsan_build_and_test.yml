name: Tsan Build & Test Parallel

on:
  push:
    branches: [ "main", "0.*" ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ "main", "0.*" ]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.changes.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # 'every' is REQUIRED here: with the default 'some' quantifier, the broad '**'
          # pattern would always match and the negation patterns ('!docs/**', '!**/*.md')
          # would have no effect, causing docs-only PRs to incorrectly trigger TSan.
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build_tsan:
    name: Build with TSAN
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-24.04
    env:
      # TSan instruments VSAG, not third-party dependencies. The daily x86 ASan job
      # remains the dedicated guard for building bundled OpenBLAS from source.
      EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=ON
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-openblas
      # Keep host runner tools intact; the CI image supplies the build toolchain.
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: |
          node24_diagnostics() {
            echo "::group::Node.js 24 diagnostics ($1 cleanup)"
            date -u '+%Y-%m-%dT%H:%M:%SZ' || true
            ls -ld /__e /__e/node24 /__e/node24/bin /__e/node24/bin/node || true
            for path in /__e /__e/node24 /__e/node24/bin /__e/node24/bin/node; do
              readlink "$path" || true
              readlink -f "$path" || true
              stat -L "$path" || true
            done
            awk '$5 ~ /^\/(__e|useless|__t)(\/|$)/' /proc/self/mountinfo || true
            timeout -k 1s 5s /__e/node24/bin/node --version || echo "node --version exit=$?"
            echo "::endgroup::"
          }
          node24_diagnostics before
          cleanup_failed=0
          for path in /useless/*; do
            case "$path" in
              /useless/runner-cache) continue ;;
            esac
            rm -rf -- "$path" || cleanup_failed=1
          done
          node24_diagnostics after
          exit "$cleanup_failed"
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          save: ${{ github.event_name != 'pull_request' }}
          key: build-tsan-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Tsan
        run: export CMAKE_GENERATOR="Ninja"; make tsan COMPILE_JOBS=3
      - name: Clean
        run: find ./build -type f -name "*.o" -exec rm -f {} +
      - name: Save Test
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: test_x86-${{ github.run_id }}-tsan
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

  test_tsan:
    name: Run TSAN Tests
    needs: [changes, build_tsan]
    if: github.event_name != 'pull_request' || needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-openblas
    steps:
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Test
        uses: actions/download-artifact@v5
        with:
          name: test_x86-${{ github.run_id }}-tsan
          path: ./build/
      - name: Run TSAN tests
        env:
          # System OpenBLAS is not TSan-instrumented; keep BLAS work on the calling
          # thread so its internal worker handoff cannot hide synchronization.
          # VSAG's own thread pools and concurrent test cases remain enabled.
          OPENBLAS_NUM_THREADS: "1"
        run: |
          echo race:libomp.so > omp.supp
          echo race:libomp.so.5 >> omp.supp
          echo race:fmt::v10::detail::format_decimal >> omp.supp
          echo "race:libmkl_intel_thread.so.2" >> omp.supp
          export TSAN_OPTIONS=suppressions=omp.supp
          chmod +x ./build/tests/functests
          ./build/tests/functests "[concurrent]~[daily]"
