name: Nightly Coverage Badge

on:
  workflow_run:
    workflows: [Nightly CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  publish:
    if: >-
      github.repository == 'antgroup/vsag' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_repository.full_name == 'antgroup/vsag' &&
      github.event.workflow_run.path == '.github/workflows/daily_test.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: nightly-coverage-badge
      cancel-in-progress: false
    steps:
      - name: Check the Coverage job in this attempt
        id: coverage
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo,
              run_id: run.id,
              attempt_number: run.run_attempt,
              per_page: 100,
            });
            core.setOutput('available', jobs.some(job =>
              job.name === 'Coverage — C++ lines and branches' && job.conclusion === 'success'));
      - uses: actions/checkout@v5
        if: steps.coverage.outputs.available == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the Coverage job report
        if: steps.coverage.outputs.available == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: daily-job-full-coverage-coverage-0-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nightly-coverage-report
      - name: Publish the latest C++ line coverage
        if: steps.coverage.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          badge_repo=$(mktemp -d)
          git init --quiet --initial-branch=nightly-coverage-badge "$badge_repo"
          git -C "$badge_repo" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$badge_repo" config credential.helper '!gh auth git-credential'

          if git -C "$badge_repo" ls-remote --exit-code origin refs/heads/nightly-coverage-badge >/dev/null; then
            git -C "$badge_repo" fetch --quiet --depth=1 origin refs/heads/nightly-coverage-badge
            git -C "$badge_repo" reset --quiet --hard FETCH_HEAD
          else
            test "$?" -eq 2
          fi

          python3 scripts/testing/nightly_coverage_badge.py "$GITHUB_EVENT_PATH" \
            "$RUNNER_TEMP/nightly-coverage-report/job-report.json" "$badge_repo"
          git -C "$badge_repo" add README.md badge.json source.json
          if git -C "$badge_repo" diff --cached --quiet; then
            exit 0
          fi

          git -C "$badge_repo" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'ci: update Nightly C++ line coverage'
          git -C "$badge_repo" push origin HEAD:refs/heads/nightly-coverage-badge
