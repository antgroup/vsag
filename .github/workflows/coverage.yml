name: Coverage

on:
  push:
    branches: [ "main", "0.*" ]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.changes.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # 'every' is REQUIRED here: with the default 'some' quantifier, the broad '**'
          # pattern would always match and the negation patterns ('!docs/**', '!**/*.md')
          # would have no effect, causing docs-only pushes to incorrectly trigger Coverage.
          predicate-quantifier: 'every'
          filters: |
            non_markdown:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  coverage:
    name: Test Coverage
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.non_markdown == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-x86-openblas
    env:
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Prepare FetchContent Sources
        uses: ./.github/actions/prepare-fetchcontent
        with:
          include-tests: "true"
      - name: Cache ExternalProject Archives
        uses: actions/cache@v4
        with:
          path: .ci-downloads
          key: external-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extern/**/*.cmake') }}
          restore-keys: |
            external-${{ runner.os }}-${{ runner.arch }}-
      - name: Install lcov
        run: |
          apt update
          apt install -y libcapture-tiny-perl libdatetime-perl curl jq
          git clone https://github.com/linux-test-project/lcov.git
          cd lcov && git checkout v2.3 && make install
          lcov --version
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          save: ${{ github.event_name != 'pull_request' }}
          key: build-cov-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Compile with Coverage Flags
        # `make cov` defaults to the OpenBLAS backend. Use the system-installed
        # OpenBLAS in the ci-x86-openblas image instead of building OpenBLAS
        # from source every run.
        run: |
          export CMAKE_GENERATOR="Ninja"
          export EXTRA_DEFINED="-DVSAG_USE_SYSTEM_OPENBLAS=ON"
          make cov
      - name: Run Test
        run: |
          ./scripts/testing/test_parallel_bg.sh
      - name: Collect Coverage Info
        run: |
          bash scripts/coverage/collect_cpp_coverage.sh
          head -n10 coverage/coverage.info
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage/coverage.info
          disable_search: true
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
