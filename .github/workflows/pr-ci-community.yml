name: Community CI

on:
  workflow_call:
    inputs:
      core:
        type: boolean
        default: true
      run-docs:
        type: boolean
        default: false
      run-simd:
        type: boolean
        default: false
      run-lite:
        type: boolean
        default: false
      team-linux:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: inputs.core
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.changes.outputs.cpp }}
      cmake: ${{ steps.changes.outputs.cmake }}
      coverage: ${{ steps.changes.outputs.coverage }}
      python: ${{ steps.changes.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cpp:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - 'Makefile'
              - 'extern/**'
              - 'cmake/**'
              - 'examples/cpp/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - '.clang-tidy'
              - '.clang-format'
            cmake:
              - 'CMakeLists.txt'
              - 'Makefile'
              - 'cmake/**'
            coverage:
              - '.github/codecov.yml'
              - '.github/actions/coverage-*/**'
              - '.github/workflows/main-ci.yml'
              - '.github/workflows/daily_test.yml'
              - '.github/workflows/pr-ci.yml'
              - '.github/workflows/pr-ci-community.yml'
              - '.github/workflows/pr-ci-team.yml'
              - 'CMakeLists.txt'
              - 'Makefile'
              - 'cmake/**'
              - 'scripts/coverage/**'
              - 'scripts/testing/test_parallel_bg.sh'
              - 'src/**/CMakeLists.txt'
              - 'tests/CMakeLists.txt'
              - 'tests/scripts/coverage_diagnostics_test.py'
              - 'tests/scripts/simd_coverage_test.py'
            python:
              - 'python/**'
              - 'cmake/vsag_c.map'
              - 'tests/python/**'
              - '.github/workflows/**'
              - 'scripts/**'

  format:
    name: Format Check
    needs: changes
    # Team checks run the same full-repository formatter for cpp changes.
    # Python-only changes still need Community formatting.
    if: (needs.changes.outputs.cpp == 'true' || needs.changes.outputs.python == 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'main' && inputs.team-linux && needs.changes.outputs.cpp == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Clang format
        run: |
          sudo apt-get update
          sudo bash scripts/deps/install_toolchain_ubuntu.sh
          sudo apt-get install -y clang-format-20
          sudo ln -sf /usr/bin/clang-format-20 /usr/bin/clang-format
          clang-format --version
      - name: Run Clang format check
        run: ./scripts/format/check_format.sh

  coverage-config:
    name: Coverage Configuration
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test coverage configuration
        run: |
          python3 -m unittest tests/scripts/coverage_diagnostics_test.py
          python3 -m unittest tests/scripts/simd_coverage_test.py
          bash -n scripts/coverage/run_simd_coverage.sh
          bash -n scripts/coverage/collect_cpp_coverage.sh
          bash -n scripts/coverage/check_cov.sh
          bash -n scripts/testing/test_parallel_bg.sh

  build-asan-x86:
    name: ASan Build X86
    needs: [changes, format]
    if: ${{ !inputs.team-linux && needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    env:
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust exact workspace for Git tooling
        run: ./scripts/ci/configure-git-safe-directory.sh
      - name: Get changed source files
        id: changed-srcs
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/linters/prepare_lint_base.py
      - name: Test CI helper scripts
        run: |
          python3 -m unittest discover -s scripts/linters -p 'test_*.py'
          python3 -m unittest tests/scripts/configure_git_safe_directory_test.py
          python3 -m unittest tests/scripts/test_build_benchmark_workflow.py
          python3 -m unittest tests/scripts/test_collect_build_metrics.py
          python3 -m unittest tests/scripts/test_dependency_workflows.py
          python3 -m unittest tests/scripts/test_asan_artifact_workflow.py
          python3 -m unittest tests/scripts/test_toolchain_compatibility.py
      - name: Prepare Host
        run: |
          sudo env VSAG_INSTALL_INTEL_MKL=OFF bash ./scripts/deps/install_deps_ubuntu.sh
          sudo apt-get install -y ccache clang-tidy-20 time
          ninja --version
          cmake --version
          g++ --version
      - name: Prepare FetchContent Sources
        uses: ./.github/actions/prepare-fetchcontent
        with:
          include-tests: "true"
          include-tools: "true"
      - name: Restore ExternalProject Archives
        uses: actions/cache/restore@v4
        with:
          path: .ci-downloads
          key: external-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extern/**/*.cmake') }}
          restore-keys: |
            external-${{ runner.os }}-${{ runner.arch }}-
      - name: Make Asan
        # The source-build OpenBLAS path remains covered by daily_test.yml.
        run: |
          export CMAKE_GENERATOR="Ninja"
          export CMAKE_EXPORT_COMPILE_COMMANDS=ON
          export EXTRA_DEFINED="-DVSAG_USE_SYSTEM_OPENBLAS=ON"
          export VSAG_ENABLE_EXAMPLES=ON
          export VSAG_ENABLE_TOOLS=ON
          # Reset counters, not cached objects. ccache uses its default directory
          # on this disposable GitHub-hosted VM; no compiler cache is restored or saved.
          ccache --zero-stats
          /usr/bin/time -p make asan COMPILE_JOBS=3
      - name: Show compiler cache diagnostics
        if: always()
        run: |
          ccache --show-stats --verbose || ccache --show-stats || true
          ccache --print-stats || true
      - name: Run Lint
        id: changed_source_lint
        if: steps.changed-srcs.outputs.pattern != ''
        env:
          LINT_PATTERN: ${{ steps.changed-srcs.outputs.pattern }}
        run: |
          source_filter=$(python3 -c 'import os, re; print("^" + re.escape(os.getcwd()) + r"/src/.*(?<!_test)\.cpp$")')
          ./scripts/linters/run-clang-tidy-20.sh -p build/ -use-color -source-filter "$source_filter" -j 4 "$LINT_PATTERN"
      - name: Verify changed-source lint execution
        if: always() && steps.changed-srcs.outcome == 'success'
        env:
          LINT_PATTERN: ${{ steps.changed-srcs.outputs.pattern }}
          LINT_OUTCOME: ${{ steps.changed_source_lint.outcome }}
        run: |
          if [ -n "$LINT_PATTERN" ] && [ "$LINT_OUTCOME" != "success" ]; then
            echo "Changed sources were found, but lint outcome was: $LINT_OUTCOME" >&2
            exit 1
          fi
      - name: Clean
        run: |
          find ./build -type f -name "*.o" -exec rm -f {} +
          find ./build -type f -name "*.cpp" -exec rm -f {} +
          find ./build -type f -name "*.a" -exec rm -f {} +
          rm -rf ./build/hdf5
      - name: Save Build
        uses: actions/upload-artifact@v5
        with:
          path: ./build
          name: build-x86-${{ github.run_id }}
          compression-level: 1
          retention-days: 1
          overwrite: 'true'

  build-asan-macos-arm64:
    name: ASan Build macOS arm64
    needs: [changes, format]
    if: needs.changes.outputs.cpp == 'true' && !(github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: macos-15
    steps:
      - name: Free Disk Space
        run: rm -rf "${RUNNER_TOOL_CACHE:-/Users/runner/hostedtoolcache}"
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: bash ./scripts/deps/install_deps.sh
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      - name: Show Toolchain
        run: |
          clang++ --version
          cmake --version
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          save: ${{ github.event_name != 'pull_request' }}
          key: build-macos-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Asan
        run: export CMAKE_GENERATOR="Ninja" CMAKE_EXPORT_COMPILE_COMMANDS=ON; make asan VSAG_ENABLE_EXAMPLES=ON COMPILE_JOBS=3

  build-python-x86:
    name: Python Build X86
    # Temporarily disable Python validation on main PRs until the Python rework lands.
    # Restore PR validation here and in test-python-x86 after that work.
    needs: [changes, format]
    if: (github.event_name != 'pull_request' || github.base_ref != 'main') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.cmake == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Prepare Env
        run: sudo bash ./scripts/deps/install_deps_ubuntu.sh
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "2G"
          save: ${{ github.event_name != 'pull_request' }}
          key: build-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Make Python Wheel
        run: |
          sudo apt update
          sudo apt install -y python3-venv
          export CMAKE_GENERATOR="Ninja"
          export VSAG_USE_SYSTEM_DEPS=AUTO
          export CIBW_ENVIRONMENT="${CIBW_ENVIRONMENT:+$CIBW_ENVIRONMENT }VSAG_USE_SYSTEM_DEPS=AUTO"
          make pyvsag
      - name: Save Wheel
        uses: actions/upload-artifact@v5
        with:
          path: ./wheelhouse
          name: wheelhouse-x86-${{ github.run_id }}
          compression-level: 1
          retention-days: 1
          overwrite: 'true'

  test-asan-x86-unittests:
    name: Test X86 Unittests
    needs: [changes, build-asan-x86]
    if: ${{ !inputs.team-linux && needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: build-x86-${{ github.run_id }}
          path: ./build
      - name: Run Unittests
        run: |
          export LD_LIBRARY_PATH="$PWD/build/src:$PWD/build/tools/autotune"
          echo leak:libomp.so > omp.supp
          echo leak:libgomp.so >> omp.supp
          export LSAN_OPTIONS=suppressions=omp.supp
          chmod +x ./build/tests/unittests ./build/tools/eval/eval_dataset_test \
            ./build/tools/autotune/autotune_test
          ./scripts/testing/test_parallel_by_name.sh unittests
          ./build/tools/eval/eval_dataset_test -d yes
          ./build/tools/autotune/autotune_test -d yes
      - name: Upload Log
        uses: actions/upload-artifact@v5
        with:
          path: ./log
          name: log-x86-unittests-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

  test-asan-x86-functests:
    name: Test X86 Functests
    needs: [changes, build-asan-x86]
    if: ${{ !inputs.team-linux && needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/src
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: build-x86-${{ github.run_id }}
          path: ./build
      - name: Run Functests
        run: |
          echo leak:libomp.so > omp.supp
          echo leak:libgomp.so >> omp.supp
          export LSAN_OPTIONS=suppressions=omp.supp
          chmod +x ./build/tests/functests
          ./scripts/testing/test_parallel_by_name.sh functests
          chmod +x ./build/tests/eval_monitor_test
          ./build/tests/eval_monitor_test -d yes
      - name: Upload Log
        uses: actions/upload-artifact@v5
        with:
          path: ./log
          name: log-x86-functests-${{ github.run_id }}
          compression-level: 1
          retention-days: 3
          overwrite: 'true'

  test-example-x86:
    name: Test Example X86
    needs: [changes, build-asan-x86]
    if: ${{ !inputs.team-linux && needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: build-x86-${{ github.run_id }}
          path: ./build
      - name: Run Examples
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/build/src:$PWD/build/tools/autotune"
          cd ./build/examples/cpp
          for example in ./*; do
            filename=$(basename "$example")
            if [[ $filename =~ ^[0-9]{3} ]]; then
              chmod +x $example
              echo "Run $example"
              $example
            fi
          done

  compatibility:
    name: Check Compatibility
    needs: [changes, build-asan-x86]
    if: ${{ !inputs.team-linux && needs.changes.outputs.cpp == 'true' }}
    runs-on: ubuntu-24.04
    env:
      COMPATIBILITY_INDEX_DIR: ${{ github.workspace }}/.ci-compatibility-inputs
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/src
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: rm -rf /useless/hostedtoolcache
      - name: Install GitHub CLI
        env:
          GH_VERSION: 2.75.0
          GH_SHA256: 98f910f4cde42a345e241f867f42b2229dda60267d7f87a56d283842519a4cb7
        run: |
          if command -v gh >/dev/null 2>&1; then
            version_output=$(gh --version)
            printf '%s\n' "$version_output"
            test "$(printf '%s\n' "$version_output" | awk 'NR == 1 {print $3}')" = "$GH_VERSION"
            exit 0
          fi
          wget --tries=3 --timeout=30 -q "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -O /tmp/gh.tar.gz
          printf '%s  %s\n' "$GH_SHA256" /tmp/gh.tar.gz | sha256sum -c -
          tar xzf /tmp/gh.tar.gz -C /tmp
          install -m 0755 /tmp/gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/gh
          rm -rf /tmp/gh.tar.gz /tmp/gh_${GH_VERSION}_linux_amd64
          gh --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Compatibility Indexes from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/download_compatibility_inputs.py --directory "$COMPATIBILITY_INDEX_DIR"
      - name: Clean Env
        run: rm -rf ./build
      - name: Download Build
        uses: actions/download-artifact@v5
        with:
          name: build-x86-${{ github.run_id }}
          path: ./build
      - name: Fix Permissions
        run: chmod +x ./build/tools/check_compatibility/check_compatibility
      - name: Run Check Compatibility
        run: BUILD_DIR=./build bash ./scripts/check_compatibility.sh

  # One py3-none wheel has to work on every supported CPython and on both numpy majors.
  test-python-x86:
    name: Test Python X86 (py${{ matrix.python }}, numpy ${{ matrix.numpy }})
    needs: [changes, build-python-x86]
    if: (github.event_name != 'pull_request' || github.base_ref != 'main') && (needs.changes.outputs.python == 'true' || needs.changes.outputs.cmake == 'true')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', numpy: '1.26.*'}
          - {python: '3.11', numpy: '2.*'}
          - {python: '3.12', numpy: '2.*', openmp: true}
          - {python: '3.13', numpy: '2.*'}
          - {python: '3.14', numpy: '2.*'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Download Wheel
        uses: actions/download-artifact@v5
        with:
          name: wheelhouse-x86-${{ github.run_id }}
          path: ./wheelhouse
      - name: Install Python Wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./wheelhouse/*.whl "numpy==${{ matrix.numpy }}" pytest
      - name: Install other OpenMP users
        # torch and scikit-learn bring their own OpenMP runtimes; the coexistence test needs both.
        if: ${{ matrix.openmp }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install scikit-learn
      - name: Check installed wheel
        run: python -c "import pyvsag, numpy; print(pyvsag.__version__, numpy.__version__)"
      - name: Run Python Test
        # Run from tests/python: the source tree's python/ directory is not on sys.path, so the
        # installed wheel is what gets imported.
        run: |
          set -euo pipefail
          cd ./tests/python/
          python3 -m pytest . -v --tb=short 2>&1 | tee test-output.log
      - name: Run Wheel Smoke Test
        run: python3 ./scripts/python/smoke_test_wheel.py
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-logs-x86-py${{ matrix.python }}-${{ github.run_id }}
          path: ./tests/python/test-output.log
          retention-days: 30
          if-no-files-found: ignore

  validate:
    if: inputs.run-docs
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/check-docs

  simd-coverage:
    if: inputs.run-simd
    name: SIMD Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: vsaglib/vsag:ci-main-openblas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test merge-base selection
        run: python3 tests/scripts/pr_simd_merge_base_test.py
      - uses: ./.github/actions/prepare-fetchcontent
        with:
          include-tests: 'true'
      - name: Install lcov
        run: |
          apt-get update
          apt-get install -y libcapture-tiny-perl libdatetime-perl curl
          # lcov v2.3, pinned to its immutable commit and archive checksum.
          curl --fail --location --retry 3 \
            https://github.com/linux-test-project/lcov/archive/79595562392671d4a30afbc1100033a8b27dc1c7.tar.gz \
            --output /tmp/lcov.tar.gz
          echo '4d567d920cd6e1ae9c941e285f00d0b564733af91c4d0f2482d7481855b9f955  /tmp/lcov.tar.gz' | sha256sum --check --strict
          mkdir /tmp/lcov
          tar -xzf /tmp/lcov.tar.gz --strip-components=1 -C /tmp/lcov
          make -C /tmp/lcov SHELL=/bin/bash install
      - name: Compare base and merge candidate
        env:
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Event base.sha may differ from the parent of the queued merge ref.
          # Compare the merge candidate with the base actually used to create it.
          # Trust only this checkout for these commands, not global Git config.
          base_sha=$(git -c safe.directory="$(pwd -P)" rev-parse --verify "${HEAD_SHA}^1")
          merge_pr_sha=$(git -c safe.directory="$(pwd -P)" rev-parse --verify "${HEAD_SHA}^2")
          if [ "$merge_pr_sha" != "$PR_HEAD_SHA" ]; then
            echo '::error::Merge candidate does not contain the expected PR head.'
            exit 1
          fi
          bash scripts/coverage/run_simd_coverage.sh "$base_sha" "$HEAD_SHA"
      - name: Publish scoped result
        if: always()
        run: |
          if [ -f simd-coverage/summary.md ]; then
            cat simd-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SIMD coverage unavailable: build, test, or collection did not finish. No passing result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-simd-coverage
          path: simd-coverage/
          retention-days: 14
          if-no-files-found: warn

  build-test-install:
    if: inputs.run-lite
    name: Lite ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [default-off, rabitq-on, sanitizer, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-lite
        with:
          mode: ${{ matrix.mode }}

  shared-checks-result:
    name: Shared Checks Result
    needs: [validate, simd-coverage, build-test-install]
    if: always()
    runs-on: ubuntu-latest
    env:
      RUN_DOCS: ${{ inputs.run-docs }}
      RUN_SIMD: ${{ inputs.run-simd }}
      RUN_LITE: ${{ inputs.run-lite }}
      DOCS_RESULT: ${{ needs.validate.result }}
      SIMD_RESULT: ${{ needs.simd-coverage.result }}
      LITE_RESULT: ${{ needs.build-test-install.result }}
    steps:
      - name: Require selected shared checks
        shell: bash
        run: |
          check_result() {
            expected=skipped
            if [ "$2" = true ]; then expected=success; fi
            if [ "$3" != "$expected" ]; then
              echo "::error::$1: expected $expected, got ${3:-unset}"
              exit 1
            fi
          }
          check_result Docs "$RUN_DOCS" "$DOCS_RESULT"
          check_result SIMD "$RUN_SIMD" "$SIMD_RESULT"
          check_result Lite "$RUN_LITE" "$LITE_RESULT"
  version-tsan-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      non_markdown: ${{ steps.execute.outputs.non_markdown }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tsan-build-and-test-changes
        id: execute
    if: ${{ (inputs.core && github.event_name == 'pull_request' && startsWith(github.base_ref, '0.') && !contains(github.base_ref, '/')) && (true) }}
  version-tsan-build-tsan:
    name: Build with TSAN
    needs:
      - version-tsan-changes
    if: ${{ ((inputs.core && github.event_name == 'pull_request' && startsWith(github.base_ref, '0.') && !contains(github.base_ref, '/')) && (github.event_name != 'pull_request' || needs.version-tsan-changes.outputs.non_markdown == 'true')) && needs.version-tsan-changes.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      EXTRA_DEFINED: -DVSAG_USE_SYSTEM_OPENBLAS=ON
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-main-openblas
      volumes:
        - /opt:/useless
    steps:
      - name: Free Disk Space
        run: |
          node24_diagnostics() {
            echo "::group::Node.js 24 diagnostics ($1 cleanup)"
            date -u '+%Y-%m-%dT%H:%M:%SZ' || true
            ls -ld /__e /__e/node24 /__e/node24/bin /__e/node24/bin/node || true
            for path in /__e /__e/node24 /__e/node24/bin /__e/node24/bin/node; do
              readlink "$path" || true
              readlink -f "$path" || true
              stat -L "$path" || true
            done
            awk '$5 ~ /^\/(__e|useless|__t)(\/|$)/' /proc/self/mountinfo || true
            timeout -k 1s 5s /__e/node24/bin/node --version || echo "node --version exit=$?"
            echo "::endgroup::"
          }
          node24_diagnostics before
          cleanup_failed=0
          for path in /useless/*; do
            case "$path" in
              /useless/runner-cache) continue ;;
            esac
            rm -rf -- "$path" || cleanup_failed=1
          done
          node24_diagnostics after
          exit "$cleanup_failed"
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/tsan-build-and-test-build-tsan
        id: execute
  version-tsan-test-tsan:
    name: Run TSAN Tests
    needs:
      - version-tsan-changes
      - version-tsan-build-tsan
    if: ${{ ((inputs.core && github.event_name == 'pull_request' && startsWith(github.base_ref, '0.') && !contains(github.base_ref, '/')) && (github.event_name != 'pull_request' || needs.version-tsan-changes.outputs.non_markdown == 'true')) && needs.version-tsan-changes.result == 'success' && needs.version-tsan-build-tsan.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: test_tsan_x86-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container:
      image: vsaglib/vsag:ci-main-openblas
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tsan-build-and-test-test-tsan
        id: execute
