name: CI Images

on:
  push:
    branches: ['1.1']
    paths:
      - 'docker/**'
      - '.github/workflows/update-ci-image.yml'
  pull_request:
    branches: ['1.1']
    paths:
      - 'docker/**'
      - '.github/workflows/update-ci-image.yml'

permissions:
  contents: read

concurrency:
  group: publish-ci-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ci-v1.1
  IMAGE_REPOS: vsaglib/vsag ghcr.io/antgroup/vsag

jobs:
  build:
    if: github.repository == 'antgroup/vsag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            file_prefix: x86
            runner: ubuntu-latest
          - arch: arm64
            file_prefix: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      FILE_PREFIX: ${{ matrix.file_prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build on the native runner and verify the toolchain
        shell: bash
        run: |
          set -euo pipefail
          variants=(base openblas)
          if [[ "$ARCH" == amd64 ]]; then variants+=(mkl); fi
          for variant in "${variants[@]}"; do
            # The existing variant Dockerfiles use the local base built in this loop.
            image="vsaglib/vsag:ci-${FILE_PREFIX}-$variant"
            docker buildx build --builder default --load --provenance=false \
              --platform "linux/$ARCH" -f "docker/Dockerfile.${FILE_PREFIX}.$variant" -t "$image" .
            test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ARCH"
            docker run --rm "$image" clang-format-15 --version
          done
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the native images under run-specific staging tags
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for variant in base openblas mkl; do
            if [[ "$ARCH" == arm64 && "$variant" == mkl ]]; then continue; fi
            for repo in $IMAGE_REPOS; do
              target="$repo:$IMAGE_PREFIX-$variant-run-$GITHUB_RUN_ID-$ARCH"
              docker tag "vsaglib/vsag:ci-${FILE_PREFIX}-$variant" "$target"
              docker push "$target"
            done
          done

  test-indexes:
    name: Verify index publication
    if: github.event_name == 'pull_request' && github.repository == 'antgroup/vsag'
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000/tcp
    steps:
      - uses: actions/checkout@v4
      - name: Exercise release and rejection against a disposable registry
        env:
          REGISTRY_PORT: ${{ job.services.registry.ports['5000'] }}
        run: bash docker/test-publish-indexes.sh

  publish:
    needs: build
    if: github.event_name == 'push' && github.repository == 'antgroup/vsag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all candidate indexes and publish the verified digests
        run: bash docker/publish-indexes.sh
