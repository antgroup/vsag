name: Lint

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: full
      pattern:
        type: string
        default: ''
  push:
    branches: [ "0.*" ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  clang-tidy-check:
    name: Lint
    runs-on: ubuntu-latest
    # runs-on: self-hosted
    container:
      image: vsaglib/vsag:ci-x86-openblas
    env:
      VSAG_FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.ci-fetchcontent
      VSAG_THIRDPARTY_DOWNLOAD_DIR: ${{ github.workspace }}/.ci-downloads
    concurrency:
      group: lint-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust exact workspace for Git tooling
        run: ./scripts/ci/configure-git-safe-directory.sh
      - name: Prepare FetchContent Sources
        uses: ./.github/actions/prepare-fetchcontent
      - name: Cache ExternalProject Archives
        uses: actions/cache@v4
        with:
          path: .ci-downloads
          key: external-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extern/**/*.cmake') }}
          restore-keys: |
            external-${{ runner.os }}-${{ runner.arch }}-
      - name: Install clang-tidy 20
        run: sudo apt install clang-tidy-20 -y
      - name: Load Cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "5G"
          save: ${{ github.event_name != 'pull_request' }}
          key: build-lint-${{ hashFiles('./CMakeLists.txt') }}-${{ hashFiles('./.circleci/fresh_ci_cache.commit') }}
      - name: Run lint
        env:
          LINT_MODE: ${{ inputs.mode || 'full' }}
          LINT_PATTERN: ${{ inputs.pattern }}
        # `make release` defaults to the OpenBLAS backend. Reuse the system
        # OpenBLAS shipped in the ci-x86-openblas image so lint doesn't have
        # to rebuild OpenBLAS from source on every run.
        run: |
          export CMAKE_GENERATOR="Ninja"
          export EXTRA_DEFINED="-DVSAG_USE_SYSTEM_OPENBLAS=ON"
          make release
          case "$LINT_MODE" in
            full) make lint ;;
            changed)
              test -n "$LINT_PATTERN"
              source_filter=$(python3 -c 'import os, re; print("^" + re.escape(os.getcwd()) + r"/src/.*(?<!_test)\.cpp$")')
              ./scripts/linters/run-clang-tidy-20.sh -p build-release/ -use-color -source-filter "$source_filter" -j 4 "$LINT_PATTERN"
              ;;
            *) echo "Invalid lint mode" >&2; exit 1 ;;
          esac
