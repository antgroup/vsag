name: Question / usage help
description: Ask how to use VSAG. For long discussions, prefer GitHub Discussions.
title: "[q](<scope>): <short summary>"
labels: ["question"]
assignees: ["wxyucs"]
body:
  - type: markdown
    attributes:
      value: |
        > Before opening a question issue, please consider:
        > - Searching the [docs](https://vsag.io/docs) and existing issues.
        > - Posting in [GitHub Discussions](https://github.com/antgroup/vsag/discussions)
        >   if the topic is open-ended.

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description: Select the primary product module, or not applicable for a cross-cutting question.
      options:
        - module/api
        - module/attr
        - module/datacell
        - module/index
        - module/simd
        - not applicable
        - other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the primary cross-cutting area, or not applicable if none applies.
      options:
        - area/bindings-node
        - area/bindings-python
        - area/ci
        - area/dependencies
        - area/docker
        - area/docs
        - area/examples
        - area/testing
        - area/tools
        - not applicable
        - other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: what_you_tried
    attributes:
      label: What you have already tried
      description: Docs read, configurations attempted, error messages observed.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: |
        If your question depends on environment, run
        `bash scripts/check_environment.sh` and paste the output.
      render: shell

  - type: textarea
    id: references
    attributes:
      label: References
