name: Feature request
description: Propose a new capability or public API for VSAG.
title: "[feat](<scope>): <short imperative summary>"
labels: ["kind/feature", "enhancement"]
assignees: ["wxyucs"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature. Before filing, please skim the
        [docs](https://vsag.io/docs) and the existing issues to avoid duplicates.

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description: Select the primary product module, or not applicable for a cross-cutting issue.
      options:
        - module/api
        - module/attr
        - module/datacell
        - module/index
        - module/simd
        - not applicable
        - other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the primary cross-cutting area, or not applicable if none applies.
      options:
        - area/bindings-node
        - area/bindings-python
        - area/ci
        - area/dependencies
        - area/docker
        - area/docs
        - area/examples
        - area/testing
        - area/tools
        - not applicable
        - other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What problem are you trying to solve? Who benefits? Quantify when possible
        (workload size, QPS, recall target, memory budget, etc.).
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: |
        Describe the feature, the user-facing API surface, and any new
        configuration knobs. Pseudocode is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: api_compat_impact
    attributes:
      label: API / ABI compatibility impact
      options:
        - none
        - additive only (no break)
        - breaking change
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Optional. Links to relevant code (`path:line`), docs
        (`https://vsag.io/docs/...`), papers, or related issues/PRs.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
